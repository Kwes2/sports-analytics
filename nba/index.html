<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Reference Stats</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px 20px;
            background-color: #fff;
            color: #222;
        }

        header {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .sport-nav {
            display: flex;
            gap: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .sport-nav a {
            color: #333;
            text-decoration: none;
            padding: 3px 6px;
        }

        .sport-nav a:hover, .sport-nav a.active {
            background-color: #333;
            color: #fff;
        }

        .sub-nav {
            display: flex;
            gap: 12px;
            font-size: 13px;
            border-top: 1px solid #ddd;
            padding-top: 6px;
        }

        .sub-nav button {
            background: none;
            border: none;
            padding: 0;
            color: #0056b3;
            cursor: pointer;
            text-decoration: underline;
            font-size: 13px;
        }

        .sub-nav button.active-sub {
            font-weight: bold;
            color: #000;
            text-decoration: none;
        }

        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 8px 0;
        }

        h2 {
            font-size: 18px;
            margin: 0;
        }

        /* Filter & Column Toolbar */
        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tool-btn {
            background: #eee;
            border: 1px solid #888;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .tool-btn:hover {
            background: #e2e2e2;
        }

        /* Collapsible Drawers */
        .drawer-panel {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .filter-panel-header, .column-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }

        .filter-rules-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .filter-rule-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            padding: 6px 10px;
            border: 1px solid #ddd;
            flex-wrap: wrap;
        }

        .remove-rule-btn {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #f87171;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 11px;
            margin-left: auto;
        }

        .column-checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
            background: #fff;
            padding: 8px;
            border: 1px solid #ccc;
        }

        .column-checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .preset-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        /* Responsive Scrollable Container */
        .table-scroll-container {
            overflow: auto;
            max-width: 100%;
            max-height: 78vh;
            border: 1px solid #888;
            position: relative;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            font-size: 13px;
        }

        th, td {
            padding: 4px 8px;
            border-right: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            white-space: nowrap;
        }

        /* Sticky Header Row */
        thead th {
            position: sticky;
            top: 0;
            background-color: #eee;
            font-weight: bold;
            text-align: left;
            border-bottom: 2px solid #888;
            cursor: pointer;
            user-select: none;
            z-index: 2;
        }

        thead th:hover {
            background-color: #e2e2e2;
        }

        /* Sticky Rank & Player Column */
        th.sticky-rank, td.sticky-rank {
            position: sticky;
            left: 0;
            width: 25px;
            text-align: center;
            background-color: #eee;
            z-index: 1;
            font-size: 11px;
            color: #666;
            border-right: 1px solid #bbb;
        }

        th.sticky-player, td.sticky-player {
            position: sticky;
            left: 35px;
            background-color: #fff;
            z-index: 1;
            border-right: 2px solid #666; /* Visual divider */
        }

        /* Corner Anchors (Top-Left Z-Index Override) */
        thead th.sticky-rank {
            top: 0;
            left: 0;
            z-index: 4;
            background-color: #ddd;
        }

        thead th.sticky-player {
            top: 0;
            left: 35px;
            z-index: 4;
            background-color: #eee;
        }

        tr:nth-child(even) td {
            background-color: #f9f9f9;
        }

        tr:nth-child(even) td.sticky-player {
            background-color: #f9f9f9;
        }

        tr:hover td {
            background-color: #ffffcc !important;
        }

        th.has-tip {
            border-bottom: 1px dotted #444;
            cursor: help;
        }

        th.num, td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .sort-indicator {
            font-size: 10px;
            margin-left: 3px;
            color: #666;
        }

        a.table-link {
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="sport-nav">
            <a href="../afl/">AFL</a>
            <a href="../nfl/">NFL</a>
            <a href="./" class="active">NBA</a>
            <a href="../nhl/">NHL</a>
            <a href="../f1/">F1</a>
        </div>
        <div class="sub-nav">
            <button class="active-sub" onclick="loadView('Team Stats', 'data/team_stats.json', this)">Team Stats</button>
            <button onclick="loadView('Player Stats', 'data/player_stats.json', this)">Player Stats</button>
            <button onclick="loadView('Completed Games', 'data/completed_games.json', this)">Completed Games</button>
            <button onclick="loadView('Upcoming Schedule', 'data/upcoming_games.json', this)">Upcoming Schedule</button>
        </div>
    </header>

    <div class="view-header">
        <h2 id="table-title">NBA - Team Stats</h2>
        <div class="toolbar" id="toolbar-actions">
            <!-- Populated dynamically -->
        </div>
    </div>

    <!-- Filter Tool Drawer -->
    <div id="filter-panel-container"></div>

    <!-- Column Picker Drawer -->
    <div id="column-picker-container"></div>

    <!-- Table Container -->
    <div id="table-container">Loading data...</div>

    <script>
        const STAT_GLOSSARY = {
            "GP": "Games Played",
            "GS": "Games Started",
            "W": "Wins",
            "L": "Losses",
            "WIN_PCT": "Win Percentage",
            "PACE": "Pace Factor: Estimated team possessions per 48 minutes",
            "ORTG": "Offensive Rating: Points scored per 100 possessions",
            "DRTG": "Defensive Rating: Points allowed per 100 possessions",
            "NET_RTG": "Net Rating: Point differential per 100 possessions",
            "MIN_PG": "Minutes Per Game",
            "PTS_PG": "Points Per Game",
            "PRF_PG": "Points Responsible For Per Game: PTS/G + Points Created off Assists/G",
            "PCT_TEAM_PRF": "% of Team Points Accounted For: Share of team scoring directly generated by this player",
            "REB_PG": "Rebounds Per Game",
            "AST_PG": "Assists Per Game",
            "STL_PG": "Steals Per Game",
            "BLK_PG": "Blocks Per Game",
            "TO_PG": "Turnovers Per Game",
            "PF_PG": "Personal Fouls Per Game",
            "PLUS_MINUS_PG": "Average Plus-Minus (+/-) Per Game",
            "FGM_PG": "Field Goals Made Per Game",
            "FGA_PG": "Field Goal Attempts Per Game",
            "FG_PCT": "Field Goal Percentage (FGM / FGA)",
            "FG3M_PG": "3-Pointers Made Per Game",
            "FG3A_PG": "3-Point Attempts Per Game",
            "FG3_PCT": "3-Point Percentage (3PM / 3PA)",
            "FTM_PG": "Free Throws Made Per Game",
            "FTA_PG": "Free Throw Attempts Per Game",
            "FT_PCT": "Free Throw Percentage (FTM / FTA)",
            "OREB_PG": "Offensive Rebounds Per Game",
            "DREB_PG": "Defensive Rebounds Per Game",
            "TS_PCT": "True Shooting %: Scoring efficiency factoring in 2s, 3s, and FTs",
            "EFG_PCT": "Effective FG %: Adjusted for the extra value of 3-pointers",
            "USG_PCT": "Usage Rate %: Percentage of team plays used while on the court",
            "TOV_PCT": "Turnover Rate %: Turnovers committed per 100 plays",
            "AST_TO_RATIO": "Assist-to-Turnover Ratio (AST / TO)",
            "THREE_PAR": "3-Point Attempt Rate (% of FGA from 3PT range)",
            "FT_RATE": "Free Throw Attempt Rate (FTA / FGA)",
            "PPSA": "Points Per Shot Attempt (PTS / FGA)",
            "GMSC_AVG": "Average Hollinger Game Score",
            "STOCKS_PG": "Stocks: Steals + Blocks per game",
            "AST_RECORDED": "Total season assists analyzed with play-by-play tracking",
            "PTS_CREATED_PG": "Points Created Per Game: Points generated from assists per game",
            "PTS_PER_AST": "Points Per Assist: Actual points scored per completed assist",
            "XPTS_PER_AST": "Expected Points Per Assist: Passing shot quality baseline",
            "PAOE": "Points Per Assist Over Expected: Passer Value Added per assist",
            "POINTS_ADDED_PG": "Points Added Per Game: Net points created above expected shot baseline per game",
            "RIM_AST_PCT": "% of player's total assists leading to baskets at the rim (0-4 ft)",
            "THREE_AST_PCT": "% of player's total assists leading to 3-point baskets",
            "RIM_FG_PCT": "0-4 ft (Rim) Field Goal Percentage",
            "RIM_FGA_PG": "0-4 ft (Rim) Attempts Per Game",
            "RIM_SHARE": "Percentage of total attempts at the rim (0-4 ft)",
            "MID_FG_PCT": "4-14 ft (Short Mid) Field Goal Percentage",
            "MID_FGA_PG": "4-14 ft (Short Mid) Attempts Per Game",
            "MID_SHARE": "Percentage of total attempts from 4-14 ft",
            "THREE_FG_PCT": "14+ ft (Perimeter/3PT) Field Goal Percentage",
            "THREE_FGA_PG": "14+ ft (Perimeter/3PT) Attempts Per Game",
            "THREE_SHARE": "Percentage of total attempts from 14+ ft"
        };

        let rawRows = [];
        let filteredRows = [];
        let currentMetaKeys = [];
        let currentSortColumn = null;
        let isAscending = false;
        let activeViewTitle = "";

        // Filters and Visibility State
        let activeFilterRules = [];
        let visibleColumns = new Set();
        let showFilterDrawer = false;
        let showColumnDrawer = false;

        window.onload = () => {
            loadView('Team Stats', 'data/team_stats.json', document.querySelector('.sub-nav button.active-sub'));
        };

        function formatSmartValue(val, col) {
            if (val === null || val === undefined || val === '') return '';
            if (typeof val !== 'number') return val;

            const c = col.toLowerCase();
            if (c === 'ppsa' || c === 'ast_to_ratio' || c.includes('pts_per_ast') || c.includes('xpts') || c === 'paoe' || c === 'points_added_pg') {
                return val.toFixed(2);
            }
            if (c.includes('pct') || c.includes('_pg') || c === 'pace' || c === 'ortg' || c === 'drtg' || c === 'net_rtg' || c.includes('share') || c === 'diff' || c.includes('rate') || c.includes('par') || c.includes('avg')) {
                return val.toFixed(1);
            }
            if (Number.isInteger(val)) {
                return val;
            }
            return val.toFixed(1);
        }

        function loadView(title, filePath, el) {
            document.querySelectorAll('.sub-nav button').forEach(b => b.classList.remove('active-sub'));
            if (el) el.classList.add('active-sub');

            activeViewTitle = title;
            document.getElementById('table-title').innerText = `NBA - ${title}`;
            const container = document.getElementById('table-container');
            container.innerHTML = "Loading...";

            activeFilterRules = [];
            showFilterDrawer = false;
            showColumnDrawer = false;

            fetch(filePath)
                .then(res => res.json())
                .then(payload => {
                    rawRows = payload.rows || [];
                    filteredRows = [...rawRows];
                    currentMetaKeys = payload.meta_keys || [];

                    if (rawRows.length === 0) {
                        container.innerHTML = "<p>No data recorded yet.</p>";
                        return;
                    }

                    // Reset visibility to show all columns by default
                    const sample = rawRows[0];
                    const allKeys = Object.keys(sample).filter(k => k !== "player_id" && k !== "team_id");
                    visibleColumns = new Set(allKeys);

                    currentSortColumn = null;
                    renderToolbar();
                    renderFilterDrawer();
                    renderColumnDrawer();
                    renderTable();
                })
                .catch(err => {
                    container.innerHTML = `<p style="color:red">Failed to load ${filePath}. Check that the file exists.</p>`;
                });
        }

        function renderToolbar() {
            const bar = document.getElementById('toolbar-actions');
            if (rawRows.length === 0) {
                bar.innerHTML = "";
                return;
            }

            let html = "";
            if (activeViewTitle === "Player Stats") {
                html += `<button class="tool-btn" onclick="toggleFilterDrawer()">⚡ Filters (${activeFilterRules.length})</button>`;
                html += `<button class="tool-btn" onclick="toggleColumnDrawer()">👁 Columns (${visibleColumns.size})</button>`;
            }
            html += `<button class="tool-btn" onclick="exportToCSV()">⤓ Export CSV</button>`;
            bar.innerHTML = html;
        }

        function toggleFilterDrawer() {
            showFilterDrawer = !showFilterDrawer;
            if (showFilterDrawer) showColumnDrawer = false;
            renderFilterDrawer();
            renderColumnDrawer();
        }

        function toggleColumnDrawer() {
            showColumnDrawer = !showColumnDrawer;
            if (showColumnDrawer) showFilterDrawer = false;
            renderColumnDrawer();
            renderFilterDrawer();
        }

        // ==========================================
        // COLUMN VISIBILITY PICKER & PRESETS
        // ==========================================
        function renderColumnDrawer() {
            const container = document.getElementById('column-picker-container');
            if (!showColumnDrawer || activeViewTitle !== "Player Stats" || rawRows.length === 0) {
                container.innerHTML = "";
                return;
            }

            const sample = rawRows[0];
            const allKeys = Object.keys(sample).filter(k => k !== "player_id" && k !== "team_id");

            let checkboxesHtml = "";
            allKeys.forEach(col => {
                const checked = visibleColumns.has(col);
                checkboxesHtml += `
                    <label>
                        <input type="checkbox" value="${col}" ${checked ? 'checked' : ''} onchange="toggleColumnVisibility('${col}')">
                        ${col.replace(/_/g, ' ').toUpperCase()}
                    </label>
                `;
            });

            container.innerHTML = `
                <div class="drawer-panel">
                    <div class="column-drawer-header">
                        <strong>Column Picker:</strong>
                        <div>
                            <button class="tool-btn" onclick="setColumnPreset('all')">Show All</button>
                            <button class="tool-btn" onclick="setColumnPreset('none')">Hide All</button>
                            <button class="tool-btn" onclick="toggleColumnDrawer()">Close</button>
                        </div>
                    </div>
                    <div class="preset-bar">
                        <span style="font-size:11px; align-self:center; font-weight:bold;">Presets:</span>
                        <button class="tool-btn" onclick="setColumnPreset('standard')">Standard</button>
                        <button class="tool-btn" onclick="setColumnPreset('advanced')">Advanced</button>
                        <button class="tool-btn" onclick="setColumnPreset('passing')">Passing</button>
                        <button class="tool-btn" onclick="setColumnPreset('shooting')">Shooting Zones</button>
                    </div>
                    <div class="column-checkbox-grid">${checkboxesHtml}</div>
                </div>
            `;
        }

        function toggleColumnVisibility(col) {
            if (visibleColumns.has(col)) {
                visibleColumns.delete(col);
            } else {
                visibleColumns.add(col);
            }
            renderToolbar();
            renderColumnDrawer();
            renderTable();
        }

        function setColumnPreset(preset) {
            const sample = rawRows[0];
            const allKeys = Object.keys(sample).filter(k => k !== "player_id" && k !== "team_id");

            if (preset === 'all') {
                visibleColumns = new Set(allKeys);
            } else if (preset === 'none') {
                visibleColumns = new Set(["player", "team", "pos"]);
            } else if (preset === 'standard') {
                visibleColumns = new Set(["player", "team", "pos", "gp", "gs", "min_pg", "pts_pg", "reb_pg", "ast_pg", "stl_pg", "blk_pg", "fg_pct", "fg3_pct", "ft_pct", "prf_pg"]);
            } else if (preset === 'advanced') {
                visibleColumns = new Set(["player", "team", "pos", "gp", "min_pg", "pts_pg", "ts_pct", "efg_pct", "usg_pct", "tov_pct", "ast_to_ratio", "three_par", "ft_rate", "ppsa", "gmsc_avg", "prf_pg", "pct_team_prf"]);
            } else if (preset === 'passing') {
                visibleColumns = new Set(["player", "team", "pos", "gp", "ast_pg", "pts_created_pg", "pts_per_ast", "xpts_per_ast", "paoe", "points_added_pg", "rim_ast_pct", "three_ast_pct", "prf_pg", "pct_team_prf"]);
            } else if (preset === 'shooting') {
                visibleColumns = new Set(["player", "team", "pos", "gp", "fga_pg", "fg_pct", "rim_fg_pct", "rim_fga_pg", "rim_share", "mid_fg_pct", "mid_fga_pg", "mid_share", "three_fg_pct", "three_fga_pg", "three_share"]);
            }

            renderToolbar();
            renderColumnDrawer();
            renderTable();
        }

        // ==========================================
        // DYNAMIC FILTER TOOL
        // ==========================================
        function renderFilterDrawer() {
            const container = document.getElementById('filter-panel-container');
            if (!showFilterDrawer || activeViewTitle !== "Player Stats" || rawRows.length === 0) {
                container.innerHTML = "";
                return;
            }

            const sample = rawRows[0];
            const allKeys = Object.keys(sample).filter(k => k !== "player_id" && k !== "team_id");

            let rulesHtml = "";
            activeFilterRules.forEach((rule, rIdx) => {
                const isNumeric = typeof sample[rule.column] === 'number';

                rulesHtml += `<div class="filter-rule-row">`;
                rulesHtml += `<strong>Rule ${rIdx + 1}:</strong> `;

                rulesHtml += `<select onchange="updateRuleColumn(${rIdx}, this.value)">`;
                allKeys.forEach(k => {
                    rulesHtml += `<option value="${k}" ${k === rule.column ? 'selected' : ''}>${k.replace(/_/g, ' ').toUpperCase()}</option>`;
                });
                rulesHtml += `</select>`;

                if (isNumeric) {
                    rulesHtml += `
                        <select onchange="updateRuleOperator(${rIdx}, this.value)">
                            <option value=">=" ${rule.op === '>=' ? 'selected' : ''}>&gt;=</option>
                            <option value="<=" ${rule.op === '<=' ? 'selected' : ''}>&lt;=</option>
                            <option value=">" ${rule.op === '>' ? 'selected' : ''}>&gt;</option>
                            <option value="<" ${rule.op === '<' ? 'selected' : ''}>&lt;</option>
                            <option value="=" ${rule.op === '=' ? 'selected' : ''}>=</option>
                        </select>
                        <input type="number" step="any" style="width: 75px;" value="${rule.val}" oninput="updateRuleValue(${rIdx}, this.value)" placeholder="Value" />
                    `;
                } else {
                    const distinctVals = [...new Set(rawRows.map(r => r[rule.column]))].sort();
                    rulesHtml += `<span style="font-size:12px; color:#555;">Match:</span> <div class="checkbox-group">`;
                    distinctVals.forEach(val => {
                        const checked = (rule.selectedVals || []).includes(val);
                        rulesHtml += `
                            <label>
                                <input type="checkbox" value="${val}" ${checked ? 'checked' : ''} onchange="toggleRuleCatVal(${rIdx}, '${val}')">
                                ${val}
                            </label>
                        `;
                    });
                    rulesHtml += `</div>`;
                }

                rulesHtml += `<button class="remove-rule-btn" onclick="removeRule(${rIdx})">✕ Remove</button>`;
                rulesHtml += `</div>`;
            });

            container.innerHTML = `
                <div class="drawer-panel">
                    <div class="filter-panel-header">
                        <div>
                            <strong>Filter Rules:</strong> Showing <strong>${filteredRows.length}</strong> of <strong>${rawRows.length}</strong> players
                        </div>
                        <div>
                            <button class="tool-btn" onclick="addRule()">+ Add Rule</button>
                            ${activeFilterRules.length > 0 ? `<button class="tool-btn" onclick="clearAllRules()">Clear Rules</button>` : ''}
                            <button class="tool-btn" onclick="toggleFilterDrawer()">Close</button>
                        </div>
                    </div>
                    <div class="filter-rules-list">${rulesHtml}</div>
                </div>
            `;
        }

        function addRule() {
            const sample = rawRows[0];
            const allKeys = Object.keys(sample).filter(k => k !== "player_id" && k !== "team_id");
            const defaultCol = allKeys.includes("min_pg") ? "min_pg" : allKeys[0];
            const isNum = typeof sample[defaultCol] === 'number';

            activeFilterRules.push({
                column: defaultCol,
                op: ">=",
                val: isNum ? 20 : "",
                selectedVals: isNum ? [] : [...new Set(rawRows.map(r => r[defaultCol]))]
            });

            applyFilterRules();
        }

        function removeRule(index) {
            activeFilterRules.splice(index, 1);
            applyFilterRules();
        }

        function clearAllRules() {
            activeFilterRules = [];
            applyFilterRules();
        }

        function updateRuleColumn(rIdx, col) {
            const isNum = typeof rawRows[0][col] === 'number';
            activeFilterRules[rIdx].column = col;
            activeFilterRules[rIdx].op = isNum ? ">=" : "in";
            activeFilterRules[rIdx].val = isNum ? 0 : "";
            activeFilterRules[rIdx].selectedVals = isNum ? [] : [...new Set(rawRows.map(r => r[col]))];
            applyFilterRules();
        }

        function updateRuleOperator(rIdx, op) {
            activeFilterRules[rIdx].op = op;
            applyFilterRules();
        }

        function updateRuleValue(rIdx, val) {
            activeFilterRules[rIdx].val = val !== "" ? parseFloat(val) : "";
            applyFilterRules();
        }

        function toggleRuleCatVal(rIdx, val) {
            const rule = activeFilterRules[rIdx];
            if (!rule.selectedVals) rule.selectedVals = [];
            const idx = rule.selectedVals.indexOf(val);
            if (idx > -1) {
                rule.selectedVals.splice(idx, 1);
            } else {
                rule.selectedVals.push(val);
            }
            applyFilterRules();
        }

        function applyFilterRules() {
            filteredRows = rawRows.filter(row => {
                for (const rule of activeFilterRules) {
                    const rowVal = row[rule.column];
                    const isNum = typeof rowVal === 'number';

                    if (isNum) {
                        if (rule.val === "" || isNaN(rule.val)) continue;
                        if (rule.op === ">=" && !(rowVal >= rule.val)) return false;
                        if (rule.op === "<=" && !(rowVal <= rule.val)) return false;
                        if (rule.op === ">" && !(rowVal > rule.val)) return false;
                        if (rule.op === "<" && !(rowVal < rule.val)) return false;
                        if (rule.op === "=" && !(rowVal === rule.val)) return false;
                    } else {
                        if (rule.selectedVals && rule.selectedVals.length > 0) {
                            if (!rule.selectedVals.includes(rowVal)) return false;
                        }
                    }
                }
                return true;
            });

            if (currentSortColumn) {
                sortArray(filteredRows, currentSortColumn, isAscending);
            }

            renderToolbar();
            renderFilterDrawer();
            renderTable();
        }

        // ==========================================
        // STICKY TABLE RENDERING ENGINE
        // ==========================================
        function renderTable() {
            const container = document.getElementById('table-container');
            if (filteredRows.length === 0) {
                container.innerHTML = "<p>No matching records found.</p>";
                return;
            }

            const sample = filteredRows[0];
            const allKeys = Object.keys(sample);
            const visibleKeys = allKeys.filter(k => k !== "player_id" && k !== "team_id" && visibleColumns.has(k));

            const metaCols = currentMetaKeys.filter(k => visibleKeys.includes(k));
            const statCols = visibleKeys.filter(k => !currentMetaKeys.includes(k));
            const orderedCols = [...metaCols, ...statCols];

            const isPlayerTable = orderedCols.includes("player");

            let html = `<div class="table-scroll-container"><table><thead><tr>`;

            // Far-Left Sticky Rank Header (#)
            if (isPlayerTable) {
                html += `<th class="sticky-rank">#</th>`;
            }

            orderedCols.forEach((col, idx) => {
                const isMeta = metaCols.includes(col);
                const isNumeric = typeof sample[col] === 'number';
                let indicator = '';

                if (currentSortColumn === col) {
                    indicator = `<span class="sort-indicator">${isAscending ? '▲' : '▼'}</span>`;
                }

                const colUpper = col.toUpperCase();
                const tip = STAT_GLOSSARY[colUpper] || "";
                let thClasses = [];
                if (isNumeric && !isMeta) thClasses.push("num");
                if (tip) thClasses.push("has-tip");

                // Apply sticky player class to player column
                if (col === "player") thClasses.push("sticky-player");

                const classAttr = thClasses.length ? `class="${thClasses.join(' ')}"` : '';
                const tipAttr = tip ? `title="${tip}"` : '';

                html += `
                    <th ${classAttr} ${tipAttr} onclick="sortTable('${col}')">
                        ${formatHeader(col)} ${indicator}
                    </th>`;
            });

            html += `</tr></thead><tbody>`;

            filteredRows.forEach((row, rIdx) => {
                html += `<tr>`;

                // Far-Left Sticky Rank Cell (#)
                if (isPlayerTable) {
                    html += `<td class="sticky-rank">${rIdx + 1}</td>`;
                }

                orderedCols.forEach(col => {
                    const rawVal = row[col];
                    const isMeta = metaCols.includes(col);
                    const isNumeric = typeof rawVal === 'number';

                    let cellContent = formatSmartValue(rawVal, col);
                    if (col === 'box_score' && rawVal) {
                        cellContent = `<a class="table-link" href="${rawVal}">Box Score</a>`;
                    } else if (col === 'player' && row.player_id) {
                        cellContent = `<a class="table-link" href="player.html?id=${row.player_id}">${cellContent}</a>`;
                    } else if (col === 'team' && row.team_id) {
                        cellContent = `<a class="table-link" href="team.html?id=${row.team_id}">${cellContent}</a>`;
                    }

                    let tdClasses = [];
                    if (isNumeric && !isMeta) tdClasses.push("num");
                    if (col === "player") tdClasses.push("sticky-player");
                    const classAttr = tdClasses.length ? `class="${tdClasses.join(' ')}"` : '';

                    html += `<td ${classAttr}>${cellContent}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        function sortTable(column) {
            if (currentSortColumn === column) {
                isAscending = !isAscending;
            } else {
                currentSortColumn = column;
                const isNumeric = typeof filteredRows[0][column] === 'number';
                isAscending = !isNumeric;
            }

            sortArray(filteredRows, column, isAscending);
            renderTable();
        }

        function sortArray(arr, col, asc) {
            arr.sort((a, b) => {
                let valA = a[col];
                let valB = b[col];

                if (valA === null || valA === undefined) return 1;
                if (valB === null || valB === undefined) return -1;

                if (typeof valA === 'number' && typeof valB === 'number') {
                    return asc ? valA - valB : valB - valA;
                }

                valA = valA.toString().toLowerCase();
                valB = valB.toString().toLowerCase();

                if (valA < valB) return asc ? -1 : 1;
                if (valA > valB) return asc ? 1 : -1;
                return 0;
            });
        }

        function exportToCSV() {
            if (filteredRows.length === 0) return;
            const sample = filteredRows[0];
            const allKeys = Object.keys(sample);
            const visibleKeys = allKeys.filter(k => k !== "player_id" && k !== "team_id" && visibleColumns.has(k));

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += visibleKeys.join(",") + "\r\n";

            filteredRows.forEach(row => {
                const rowValues = visibleKeys.map(k => {
                    let val = row[k];
                    if (val === null || val === undefined) return "";
                    return typeof val === 'string' && val.includes(",") ? `"${val}"` : val;
                });
                csvContent += rowValues.join(",") + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${activeViewTitle.replace(/ /g, '_')}_export.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function formatHeader(header) {
            return header.replace(/_/g, ' ').toUpperCase();
        }
    </script>
</body>
</html>
