<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Head-to-Head & Era Comparison</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px 20px;
            background-color: #fff;
            color: #222;
        }

        header {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .sport-nav {
            display: flex;
            gap: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .sport-nav a {
            color: #333;
            text-decoration: none;
            padding: 3px 6px;
        }

        .sport-nav a:hover, .sport-nav a.active {
            background-color: #333;
            color: #fff;
        }

        .back-link {
            font-size: 13px;
            color: #0056b3;
            text-decoration: underline;
            margin-bottom: 12px;
            display: inline-block;
        }

        .comparison-hero {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            padding: 14px 18px;
            margin-bottom: 20px;
            max-width: 1000px;
        }

        .selectors-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
        }

        .player-card-selector {
            background: #fff;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 3px;
        }

        .player-card-selector h3 {
            margin: 0 0 8px 0;
            font-size: 15px;
            color: #0056b3;
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
        }

        .vs-divider {
            font-size: 18px;
            font-weight: bold;
            color: #888;
            text-align: center;
        }

        .selector-row {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
        }

        .selector-row select, .selector-row input {
            padding: 4px 6px;
            font-size: 12px;
            border: 1px solid #888;
            border-radius: 2px;
            font-family: inherit;
        }

        .toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 10px 0;
            max-width: 1000px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .category-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .pill-btn {
            background: #eee;
            border: 1px solid #aaa;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 12px;
            font-weight: 500;
        }

        .pill-btn.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }

        .rate-toggle-group {
            display: flex;
            border: 1px solid #888;
            border-radius: 3px;
            overflow: hidden;
            background: #eee;
        }

        .rate-btn {
            border: none;
            background: transparent;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
        }

        .rate-btn.active {
            background: #333;
            color: #fff;
            font-weight: bold;
        }

        .compare-submit-btn {
            background: #0056b3;
            color: #fff;
            border: 1px solid #004085;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            margin-top: 10px;
            width: 100%;
        }

        .compare-submit-btn:hover {
            background: #004085;
        }

        #comparison-content {
            max-width: 1000px;
            position: relative;
        }

        #comparison-content.is-recalculating {
            opacity: 0.35;
            filter: grayscale(85%);
            pointer-events: none;
        }

        .recalc-overlay-badge {
            display: none;
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            color: #fff;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .recalc-overlay-badge.active {
            display: block;
        }

        table.compare-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
            border: 1px solid #888;
            margin-bottom: 22px;
        }

        th, td {
            padding: 5px 8px;
            border: 1px solid #ccc;
        }

        th {
            background-color: #eee;
            font-weight: bold;
            text-align: left;
            border-bottom: 2px solid #888;
            user-select: none;
            white-space: nowrap;
        }

        th.num, td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        th.has-tip, td.has-tip {
            border-bottom: 1px dotted #555;
            cursor: help;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #ffffcc;
        }

        td.pctile-cell {
            text-align: right;
            font-weight: 500;
            width: 55px;
        }

        td.winner {
            font-weight: bold;
            color: #166534;
            background-color: #f0fdf4;
        }

        td.delta-cell {
            text-align: center;
            font-weight: 600;
            font-size: 11px;
            width: 75px;
        }

        .delta-pos { color: #166534; }
        .delta-neg { color: #991b1b; }
        .delta-eq { color: #666; }
    </style>
</head>
<body>

    <header>
        <div class="sport-nav">
            <a href="../afl/">AFL</a>
            <a href="../nfl/">NFL</a>
            <a href="./" class="active">NBA</a>
            <a href="../nhl/">NHL</a>
            <a href="../f1/">F1</a>
        </div>
    </header>

    <a href="./" class="back-link">← Back to NBA Stats & Schedule</a>

    <div class="comparison-hero">
        <div class="selectors-grid">
            <!-- Player A Selector -->
            <div class="player-card-selector">
                <h3>Player A (Primary)</h3>
                <div class="selector-row">
                    <label>Player:</label>
                    <select id="select-player-a"></select>
                </div>
                <div class="selector-row">
                    <label>Window / Era:</label>
                    <select id="select-window-a" onchange="toggleCustomInputs('a')">
                        <option value="curr_reg">2026-2027 (Regular Season)</option>
                        <option value="curr_post">2026-2027 (Playoffs)</option>
                        <option value="prev_reg">2025-2026 (Regular Season)</option>
                        <option value="prev_post">2025-2026 (Playoffs)</option>
                        <option value="last_1_wks">Last 1 Week</option>
                        <option value="last_5_wks">Last 5 Weeks</option>
                        <option value="last_10_wks">Last 10 Weeks</option>
                        <option value="custom">Custom Date Range</option>
                    </select>
                </div>
                <div class="selector-row" id="custom-row-a" style="display: none;">
                    <label>Dates:</label>
                    <div style="display: flex; gap: 4px;">
                        <input type="date" id="start-date-a" value="2025-10-22" style="flex:1;">
                        <input type="date" id="end-date-a" value="2026-04-15" style="flex:1;">
                    </div>
                </div>
            </div>

            <div class="vs-divider">VS</div>

            <!-- Player B Selector -->
            <div class="player-card-selector">
                <h3>Player B (Comparison)</h3>
                <div class="selector-row">
                    <label>Player:</label>
                    <select id="select-player-b"></select>
                </div>
                <div class="selector-row">
                    <label>Window / Era:</label>
                    <select id="select-window-b" onchange="toggleCustomInputs('b')">
                        <option value="curr_reg">2026-2027 (Regular Season)</option>
                        <option value="curr_post">2026-2027 (Playoffs)</option>
                        <option value="prev_reg" selected>2025-2026 (Regular Season)</option>
                        <option value="prev_post">2025-2026 (Playoffs)</option>
                        <option value="last_1_wks">Last 1 Week</option>
                        <option value="last_5_wks">Last 5 Weeks</option>
                        <option value="last_10_wks">Last 10 Weeks</option>
                        <option value="custom">Custom Date Range</option>
                    </select>
                </div>
                <div class="selector-row" id="custom-row-b" style="display: none;">
                    <label>Dates:</label>
                    <div style="display: flex; gap: 4px;">
                        <input type="date" id="start-date-b" value="2024-10-22" style="flex:1;">
                        <input type="date" id="end-date-b" value="2025-04-15" style="flex:1;">
                    </div>
                </div>
            </div>
        </div>

        <button class="compare-submit-btn" onclick="executeComparison()">⚡ Run Head-to-Head Comparison</button>
    </div>

    <div class="toolbar-row">
        <div class="category-pills">
            <button class="pill-btn active" onclick="filterCategory('All', this)">All Categories</button>
            <button class="pill-btn" onclick="filterCategory('Basic', this)">Basic</button>
            <button class="pill-btn" onclick="filterCategory('Advanced', this)">Advanced</button>
            <button class="pill-btn" onclick="filterCategory('Shooting', this)">Shooting</button>
            <button class="pill-btn" onclick="filterCategory('Passing', this)">Passing & xPRF</button>
            <button class="pill-btn" onclick="filterCategory('Ratings', this)">Ratings & On/Off</button>
        </div>

        <div class="rate-toggle-group">
            <button id="cmp-rate-pg" class="rate-btn active" onclick="switchCompareRateMode('pg')">Per Game</button>
            <button id="cmp-rate-p100" class="rate-btn" onclick="switchCompareRateMode('p100')">Per 100 Poss</button>
            <button id="cmp-rate-p36" class="rate-btn" onclick="switchCompareRateMode('p36')">Per 36 Min</button>
        </div>
    </div>

    <div id="comparison-content">
        <div id="cmp-recalc-badge" class="recalc-overlay-badge">⏳ Recalculating comparisons across windows...</div>
        <div id="comparison-tables">Select players above and click Run Comparison.</div>
    </div>

    <script>
        function getDataPath(fileName) {
            const p = window.location.pathname.toLowerCase();
            if (p.includes('/nba/') || p.endsWith('/nba')) {
                return `data/${fileName}`;
            }
            return `nba/data/${fileName}`;
        }

        function getApiPath(endpoint) {
            const p = window.location.pathname.toLowerCase();
            if (p.includes('/nba/') || p.endsWith('/nba')) {
                return `api/${endpoint}`;
            }
            return `nba/api/${endpoint}`;
        }

        let STAT_DEFINITIONS = {};
        let allPlayersList = [];
        let playerAData = null;
        let playerBData = null;
        let activeCmpRateMode = 'pg';
        let activeCategoryFilter = 'All';

        fetch(getDataPath('stat_definitions.json'))
            .then(res => res.json())
            .then(data => { STAT_DEFINITIONS = data; })
            .catch(() => {});

        window.onload = () => {
            fetch(getDataPath('player_stats.json'))
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(payload => {
                    allPlayersList = payload.rows || [];
                    populatePlayerDropdowns();
                })
                .catch(() => {
                    document.getElementById('comparison-tables').innerHTML = "<p style='color:red;'>Failed to load player directory. Verify data/player_stats.json exists.</p>";
                });
        };

        function populatePlayerDropdowns() {
            const selectA = document.getElementById('select-player-a');
            const selectB = document.getElementById('select-player-b');
            selectA.innerHTML = "";
            selectB.innerHTML = "";

            allPlayersList.forEach((p, idx) => {
                const optA = document.createElement('option');
                optA.value = p.player_id;
                optA.textContent = `${p.player} (${p.team} - ${p.pos})`;
                if (idx === 0) optA.selected = true;
                selectA.appendChild(optA);

                const optB = document.createElement('option');
                optB.value = p.player_id;
                optB.textContent = `${p.player} (${p.team} - ${p.pos})`;
                if (idx === 1 || (idx === 0 && allPlayersList.length === 1)) optB.selected = true;
                selectB.appendChild(optB);
            });

            executeComparison();
        }

        function toggleCustomInputs(side) {
            const sel = document.getElementById(`select-window-${side}`).value;
            const row = document.getElementById(`custom-row-${side}`);
            if (row) row.style.display = (sel === 'custom') ? 'flex' : 'none';
        }

        function switchCompareRateMode(mode) {
            activeCmpRateMode = mode;
            document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('active'));
            const b = document.getElementById(`cmp-rate-${mode}`);
            if (b) b.classList.add('active');
            if (playerAData && playerBData) renderComparisonTables();
        }

        function filterCategory(cat, el) {
            activeCategoryFilter = cat;
            document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
            if (playerAData && playerBData) renderComparisonTables();
        }

        function getPercentileColor(p) {
            if (p === null || p === undefined || isNaN(p) || p === '-') return '#f0f0f0';
            const num = parseFloat(p);
            if (num < 50) {
                const t = num / 50.0;
                const r = Math.round(59 + (240 - 59) * t);
                const g = Math.round(130 + (240 - 130) * t);
                const b = Math.round(246 + (240 - 246) * t);
                return `rgb(${r}, ${g}, ${b})`;
            } else {
                const t = (num - 50.0) / 50.0;
                const r = Math.round(240 + (239 - 240) * t);
                const g = Math.round(240 + (68 - 240) * t);
                const b = Math.round(240 + (68 - 240) * t);
                return `rgb(${r}, ${g}, ${b})`;
            }
        }

        function buildWindowParams(side) {
            const pid = document.getElementById(`select-player-${side}`).value;
            const winVal = document.getElementById(`select-window-${side}`).value;
            const q = new URLSearchParams();
            q.append("id", pid);

            if (winVal === "curr_reg") { q.append("season_year", "2027"); q.append("season_type", "2"); }
            else if (winVal === "curr_post") { q.append("season_year", "2027"); q.append("season_type", "3"); }
            else if (winVal === "prev_reg") { q.append("season_year", "2026"); q.append("season_type", "2"); }
            else if (winVal === "prev_post") { q.append("season_year", "2026"); q.append("season_type", "3"); }
            else if (winVal.startsWith("last_")) {
                const wks = parseInt(winVal.replace("last_", "").replace("_wks", ""));
                const now = new Date();
                const past = new Date(now.getTime() - (wks * 7 * 24 * 60 * 60 * 1000));
                q.append("start", past.toISOString().slice(0, 10));
                q.append("end", now.toISOString().slice(0, 10));
            } else if (winVal === "custom") {
                q.append("start", document.getElementById(`start-date-${side}`).value);
                q.append("end", document.getElementById(`end-date-${side}`).value);
            }
            return q.toString();
        }

        function executeComparison() {
            const badge = document.getElementById('cmp-recalc-badge');
            const wrap = document.getElementById('comparison-content');
            if (badge) badge.classList.add('active');
            if (wrap) wrap.classList.add('is-recalculating');

            const queryA = buildWindowParams('a');
            const queryB = buildWindowParams('b');

            const fetchSingle = (query) => {
                return fetch(`${getApiPath('player_window')}?${query}`)
                    .then(r => {
                        if (!r.ok) throw new Error(`HTTP ${r.status}`);
                        return r.json();
                    });
            };

            Promise.all([fetchSingle(queryA), fetchSingle(queryB)])
                .then(([resA, resB]) => {
                    if (badge) badge.classList.remove('active');
                    if (wrap) wrap.classList.remove('is-recalculating');
                    playerAData = resA;
                    playerBData = resB;
                    renderComparisonTables();
                })
                .catch(err => {
                    if (badge) badge.classList.remove('active');
                    if (wrap) wrap.classList.remove('is-recalculating');
                    document.getElementById('comparison-tables').innerHTML = `<p style='color:red;'>Could not retrieve records for one of the selections (${err.message}). Verify both players have games in their selected windows.</p>`;
                });
        }

        function formatScaledVal(val, key, minPg) {
            if (val === null || val === undefined || isNaN(val)) return '-';
            const k = key.toLowerCase();
            let scaled = val;

            if (activeCmpRateMode !== 'pg') {
                const min = minPg && minPg > 0 ? minPg : 36.0;
                const isCounting = (k.endsWith('_pg') || k === 'pts' || k === 'reb' || k === 'ast' || k === 'stl' || k === 'blk' || k === 'to' || k === 'fga' || k === 'fgm');
                if (isCounting) {
                    if (activeCmpRateMode === 'p36') scaled = val * (36.0 / min);
                    else if (activeCmpRateMode === 'p100') scaled = val * (100.0 / (min * 2.0));
                }
            }

            const meta = STAT_DEFINITIONS[k];
            if (meta && meta.format === 'int') return Math.round(scaled);
            if (meta && meta.format === 'float2') return scaled.toFixed(2);
            if (meta && meta.format === 'pct1') return `${scaled.toFixed(1)}%`;
            return Number.isInteger(scaled) ? scaled : scaled.toFixed(1);
        }

        function renderComparisonTables() {
            const container = document.getElementById('comparison-tables');
            if (!playerAData || !playerBData || playerAData.error || playerBData.error) {
                container.innerHTML = "<p style='color:red;'>No records found for one of the players in their selected window.</p>";
                return;
            }

            let minA = 36.0, minB = 36.0;
            (playerAData.sections || []).forEach(sec => {
                if (sec.data && sec.data.rows) {
                    const r = sec.data.rows.find(x => x.stat_key === "min_pg");
                    if (r && r.value) minA = parseFloat(r.value);
                }
            });
            (playerBData.sections || []).forEach(sec => {
                if (sec.data && sec.data.rows) {
                    const r = sec.data.rows.find(x => x.stat_key === "min_pg");
                    if (r && r.value) minB = parseFloat(r.value);
                }
            });

            const bMap = {};
            (playerBData.sections || []).forEach(sec => {
                if (sec.data && sec.data.rows) {
                    sec.data.rows.forEach(r => { bMap[r.stat_key] = r; });
                }
            });

            let html = "";

            (playerAData.sections || []).forEach(sec => {
                const cat = sec.category || "Miscellaneous";
                if (activeCategoryFilter !== 'All' && activeCategoryFilter !== cat) {
                    return;
                }

                html += `<h3>${sec.title}</h3>`;
                html += `
                    <table class="compare-table">
                        <thead>
                            <tr>
                                <th>Metric</th>
                                <th class="num">${playerAData.name} (${activeCmpRateMode.toUpperCase()})</th>
                                <th class="num">%ile</th>
                                <th style="text-align:center;">Delta</th>
                                <th class="num">%ile</th>
                                <th class="num">${playerBData.name} (${activeCmpRateMode.toUpperCase()})</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                (sec.data.rows || []).forEach(rowA => {
                    const k = rowA.stat_key;
                    const rowB = bMap[k] || { value: 0, league_percentile: 50.0 };

                    const meta = STAT_DEFINITIONS[k.toLowerCase()];
                    const hib = meta ? meta.higher_is_better : true;
                    const tip = meta ? meta.tooltip : rowA.tooltip;
                    const tipAttr = tip ? `class="has-tip" title="${tip}"` : '';

                    const rawA = parseFloat(rowA.value) || 0;
                    const rawB = parseFloat(rowB.value) || 0;
                    const diff = rawA - rawB;

                    let isAWinner = false, isBWinner = false;
                    if (rawA !== rawB) {
                        isAWinner = hib ? (rawA > rawB) : (rawA < rawB);
                        isBWinner = !isAWinner;
                    }

                    let deltaStr = "0.0";
                    let deltaClass = "delta-eq";
                    if (diff > 0) {
                        deltaStr = `+${diff.toFixed(1)}`;
                        deltaClass = hib ? "delta-pos" : "delta-neg";
                    } else if (diff < 0) {
                        deltaStr = `${diff.toFixed(1)}`;
                        deltaClass = hib ? "delta-neg" : "delta-pos";
                    }

                    const pctAColor = getPercentileColor(rowA.league_percentile);
                    const pctBColor = getPercentileColor(rowB.league_percentile);

                    html += `
                        <tr>
                            <td ${tipAttr}><strong>${rowA.stat_name}</strong></td>
                            <td class="num ${isAWinner ? 'winner' : ''}">${formatScaledVal(rawA, k, minA)}</td>
                            <td class="pctile-cell" style="background-color: ${pctAColor};">${rowA.league_percentile}</td>
                            <td class="delta-cell ${deltaClass}">${deltaStr}</td>
                            <td class="pctile-cell" style="background-color: ${pctBColor};">${rowB.league_percentile}</td>
                            <td class="num ${isBWinner ? 'winner' : ''}">${formatScaledVal(rawB, k, minB)}</td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
