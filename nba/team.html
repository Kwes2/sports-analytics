<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Team Profile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px 20px;
            background-color: #fff;
            color: #222;
        }

        header {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .sport-nav {
            display: flex;
            gap: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .sport-nav a {
            color: #333;
            text-decoration: none;
            padding: 3px 6px;
        }

        .sport-nav a:hover, .sport-nav a.active {
            background-color: #333;
            color: #fff;
        }

        .back-link {
            font-size: 13px;
            color: #0056b3;
            text-decoration: underline;
            margin-bottom: 12px;
            display: inline-block;
        }

        .team-header {
            margin-bottom: 20px;
            padding: 12px 16px;
            background-color: #f7f7f7;
            border: 1px solid #ccc;
            max-width: 950px;
        }

        .team-header h1 {
            font-size: 22px;
            margin: 0 0 4px 0;
        }

        .team-header .meta {
            font-size: 14px;
            color: #555;
        }

        h3 {
            font-size: 15px;
            margin: 22px 0 8px 0;
        }

        .shot-chart-container {
            display: flex;
            gap: 25px;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 25px;
            max-width: 950px;
        }

        .court-wrapper {
            border: 1px solid #888;
            background-color: #fafafa;
            padding: 10px;
            width: 250px;
        }

        .court-title {
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 6px;
        }

        svg.half-court {
            width: 100%;
            height: auto;
            display: block;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 950px;
            font-size: 13px;
            border: 1px solid #888;
            margin-bottom: 25px;
        }

        .shot-chart-container table {
            flex: 1;
            min-width: 450px;
            margin-bottom: 0;
        }

        th, td {
            padding: 4px 8px;
            border: 1px solid #ccc;
        }

        th {
            background-color: #eee;
            font-weight: bold;
            text-align: left;
            border-bottom: 2px solid #888;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background-color: #e2e2e2;
        }

        th.num, td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #ffffcc;
        }

        .sort-indicator {
            font-size: 10px;
            margin-left: 4px;
            color: #666;
        }

        a.table-link {
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="sport-nav">
            <a href="../afl/">AFL</a>
            <a href="../nfl/">NFL</a>
            <a href="./" class="active">NBA</a>
            <a href="../nhl/">NHL</a>
            <a href="../f1/">F1</a>
        </div>
    </header>

    <a href="./" class="back-link">← Back to NBA Standings & Schedule</a>

    <div id="team-content">Loading team profile...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const teamId = urlParams.get('id');

        const tableState = {};

        window.onload = () => {
            if (!teamId) {
                document.getElementById('team-content').innerHTML = "<p style='color:red;'>No Team ID provided in URL.</p>";
                return;
            }

            fetch(`data/teams/${teamId}.json`)
                .then(res => res.json())
                .then(data => renderTeamEngine(data))
                .catch(err => {
                    document.getElementById('team-content').innerHTML = `<p style="color:red">Failed to load profile for Team ID ${teamId}.</p>`;
                });
        };

        function getPercentileColor(p) {
            if (p === null || p === undefined || isNaN(p)) return '#f0f0f0';
            if (p < 50) {
                const t = p / 50.0;
                const r = Math.round(59 + (240 - 59) * t);
                const g = Math.round(130 + (240 - 130) * t);
                const b = Math.round(246 + (240 - 246) * t);
                return `rgb(${r}, ${g}, ${b})`;
            } else {
                const t = (p - 50.0) / 50.0;
                const r = Math.round(240 + (239 - 240) * t);
                const g = Math.round(240 + (68 - 240) * t);
                const b = Math.round(240 + (68 - 240) * t);
                return `rgb(${r}, ${g}, ${b})`;
            }
        }

        function createCourtSVG(splitsRows) {
            let z0_4 = 50, z4_14 = 50, z14_plus = 50;
            if (splitsRows) {
                splitsRows.forEach(r => {
                    if (r.zone === "0-4 ft") z0_4 = r.eff_percentile;
                    if (r.zone === "4-14 ft") z4_14 = r.eff_percentile;
                    if (r.zone === "14+ ft") z14_plus = r.eff_percentile;
                });
            }

            return `
                <svg class="half-court" viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="0" width="500" height="470" fill="${getPercentileColor(z14_plus)}" stroke="#333" stroke-width="4"/>
                    <path d="M 110,0 L 110,52.5 A 140,140 0 0,0 390,52.5 L 390,0 Z" fill="${getPercentileColor(z4_14)}" stroke="#555" stroke-width="2"/>
                    <path d="M 210,0 L 210,52.5 A 40,40 0 0,0 290,52.5 L 290,0 Z" fill="${getPercentileColor(z0_4)}" stroke="#555" stroke-width="2"/>

                    <!-- Court lines -->
                    <rect x="170" y="0" width="160" height="190" fill="none" stroke="#222" stroke-width="2"/>
                    <circle cx="250" cy="190" r="60" fill="none" stroke="#222" stroke-width="2"/>
                    <line x1="220" y1="40" x2="280" y2="40" stroke="#000" stroke-width="4"/>
                    <circle cx="250" cy="52.5" r="9" fill="none" stroke="#d97706" stroke-width="3"/>
                    <path d="M 30,0 L 30,140 A 237.5,237.5 0 0,0 470,140 L 470,0" fill="none" stroke="#222" stroke-width="2"/>
                </svg>
            `;
        }

        function renderTeamEngine(data) {
            const container = document.getElementById('team-content');

            let html = `
                <div class="team-header">
                    <h1>${data.team_name}</h1>
                    <div class="meta">Record: <strong>${data.record}</strong> (${data.win_pct}%) | Net Differential: <strong>${data.diff > 0 ? '+' : ''}${data.diff}</strong></div>
                </div>
            `;

            (data.sections || []).forEach((section, idx) => {
                const sectionId = `team_sec_${idx}`;
                html += `<h3>${section.title}</h3>`;

                tableState[sectionId] = {
                    metaKeys: section.data.meta_keys || [],
                    rows: section.data.rows || [],
                    sortCol: null,
                    isAsc: false
                };

                if (section.type === "shot_chart") {
                    html += `
                        <div class="shot-chart-container">
                            <div class="court-wrapper">
                                <div class="court-title">Season Heat Map</div>
                                ${createCourtSVG(section.data.rows)}
                            </div>
                            <div id="${sectionId}_box">
                                ${buildTableHTML(sectionId)}
                            </div>
                        </div>
                    `;
                } else {
                    html += `<div id="${sectionId}_box">${buildTableHTML(sectionId)}</div>`;
                }
            });

            container.innerHTML = html;
        }

        function buildTableHTML(sectionId) {
            const state = tableState[sectionId];
            if (!state || state.rows.length === 0) return "<p>No data recorded.</p>";

            const sample = state.rows[0];
            const allKeys = Object.keys(sample);
            const visibleKeys = allKeys.filter(k => k !== "player_id");
            const metaCols = state.metaKeys.filter(k => visibleKeys.includes(k));
            const statCols = visibleKeys.filter(k => !state.metaKeys.includes(k));
            const orderedCols = [...metaCols, ...statCols];

            let html = `<table><thead><tr>`;
            orderedCols.forEach(col => {
                const isMeta = metaCols.includes(col);
                const isNumeric = typeof sample[col] === 'number';
                let indicator = '';

                if (state.sortCol === col) {
                    indicator = `<span class="sort-indicator">${state.isAsc ? '▲' : '▼'}</span>`;
                }

                html += `<th class="${isNumeric && !isMeta ? 'num' : ''}" onclick="handleSort('${sectionId}', '${col}')">
                    ${col.replace(/_/g, ' ').toUpperCase()} ${indicator}
                </th>`;
            });
            html += `</tr></thead><tbody>`;

            state.rows.forEach(row => {
                html += `<tr>`;
                orderedCols.forEach(col => {
                    const val = row[col];
                    const isMeta = metaCols.includes(col);
                    const isNumeric = typeof val === 'number';

                    let cellContent = val !== null ? val : '';
                    if (col === 'player' && row.player_id) {
                        cellContent = `<a class="table-link" href="player.html?id=${row.player_id}">${val}</a>`;
                    } else if (col === 'box_score' && val) {
                        cellContent = `<a class="table-link" href="${val}">Box Score</a>`;
                    }

                    html += `<td class="${isNumeric && !isMeta ? 'num' : ''}">${cellContent}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            return html;
        }

        function handleSort(sectionId, col) {
            const state = tableState[sectionId];
            if (!state || state.rows.length === 0) return;

            if (state.sortCol === col) {
                state.isAsc = !state.isAsc;
            } else {
                state.sortCol = col;
                const isNumeric = typeof state.rows[0][col] === 'number';
                state.isAsc = !isNumeric;
            }

            state.rows.sort((a, b) => {
                let valA = a[col];
                let valB = b[col];
                if (valA === null || valA === undefined) return 1;
                if (valB === null || valB === undefined) return -1;

                if (typeof valA === 'number' && typeof valB === 'number') {
                    return state.isAsc ? valA - valB : valB - valA;
                }
                valA = valA.toString().toLowerCase();
                valB = valB.toString().toLowerCase();
                if (valA < valB) return state.isAsc ? -1 : 1;
                if (valA > valB) return state.isAsc ? 1 : -1;
                return 0;
            });

            document.getElementById(`${sectionId}_box`).innerHTML = buildTableHTML(sectionId);
        }
    </script>
</body>
</html>
