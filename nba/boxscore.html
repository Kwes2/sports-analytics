<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Box Score</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px 20px;
            background-color: #fff;
            color: #222;
        }

        header {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .sport-nav {
            display: flex;
            gap: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .sport-nav a {
            color: #333;
            text-decoration: none;
            padding: 3px 6px;
        }

        .sport-nav a:hover, .sport-nav a.active {
            background-color: #333;
            color: #fff;
        }

        .back-link {
            font-size: 13px;
            color: #0056b3;
            text-decoration: underline;
            margin-bottom: 12px;
            display: inline-block;
        }

        .game-summary {
            margin-bottom: 20px;
            padding: 10px 14px;
            background-color: #f7f7f7;
            border: 1px solid #ccc;
            max-width: 950px;
        }

        .game-summary h1 {
            font-size: 20px;
            margin: 0 0 6px 0;
        }

        .game-summary .meta {
            font-size: 13px;
            color: #555;
        }

        h3 {
            font-size: 16px;
            margin: 24px 0 8px 0;
        }

        h4 {
            font-size: 14px;
            margin: 12px 0 6px 0;
            color: #444;
        }

        .team-splits-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 25px;
            max-width: 950px;
        }

        .court-wrapper {
            border: 1px solid #888;
            background-color: #fafafa;
            padding: 8px;
            width: 200px;
        }

        svg.half-court {
            width: 100%;
            height: auto;
            display: block;
        }

        .court-zone {
            cursor: pointer;
            transition: opacity 0.15s, stroke-width 0.15s;
        }

        .court-zone:hover {
            opacity: 0.85;
            stroke: #000 !important;
            stroke-width: 3 !important;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 950px;
            font-size: 13px;
            border: 1px solid #888;
            margin-bottom: 25px;
        }

        .team-splits-container table {
            flex: 1;
            margin-bottom: 0;
        }

        th, td {
            padding: 4px 8px;
            border: 1px solid #ccc;
        }

        th {
            background-color: #eee;
            font-weight: bold;
            text-align: left;
            border-bottom: 2px solid #888;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background-color: #e2e2e2;
        }

        th.has-tip {
            border-bottom: 1px dotted #666;
            cursor: help;
        }

        th.num, td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #ffffcc;
        }

        .sort-indicator {
            font-size: 10px;
            margin-left: 4px;
            color: #666;
        }

        a.table-link {
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="sport-nav">
            <a href="../afl/">AFL</a>
            <a href="../nfl/">NFL</a>
            <a href="./" class="active">NBA</a>
            <a href="../nhl/">NHL</a>
            <a href="../f1/">F1</a>
        </div>
    </header>

    <a href="./" class="back-link">← Back to NBA Schedule & Stats</a>

    <div id="boxscore-content">Loading box score...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        const STAT_GLOSSARY = {
            "MIN": "Minutes Played",
            "PTS": "Points",
            "REB": "Rebounds",
            "AST": "Assists",
            "STL": "Steals",
            "BLK": "Blocks",
            "TO": "Turnovers",
            "PF": "Personal Fouls",
            "FGM": "Field Goals Made",
            "FGA": "Field Goals Attempted",
            "FG3M": "3-Point Field Goals Made",
            "FG3A": "3-Point Field Goals Attempted",
            "FTM": "Free Throws Made",
            "FTA": "Free Throws Attempted",
            "OREB": "Offensive Rebounds",
            "DREB": "Defensive Rebounds",
            "GMSC": "John Hollinger's Game Score Rating",
            "PACE": "Possessions per 48 minutes",
            "ORTG": "Offensive Rating (Points per 100 possessions)",
            "DRTG": "Defensive Rating (Points allowed per 100 possessions)",
            "NET_RTG": "Net Rating (ORtg - DRtg)",
            "EFG_PCT": "Effective FG %",
            "TOV_PCT": "Turnover %",
            "ORB_PCT": "Offensive Rebound %",
            "FT_RATE": "Free Throw Attempt Rate (FTA / FGA)",
            "SHOT_SHARE": "Percentage of team attempts in this zone"
        };

        const boxTableState = {};

        window.onload = () => {
            if (!gameId) {
                document.getElementById('boxscore-content').innerHTML = "<p style='color:red;'>No Game ID provided in URL.</p>";
                return;
            }

            fetch(`data/boxscores/${gameId}.json`)
                .then(res => res.json())
                .then(data => renderBoxScore(data))
                .catch(err => {
                    document.getElementById('boxscore-content').innerHTML = `<p style="color:red">Failed to load box score for game ID ${gameId}.</p>`;
                });
        };

        function getGameFGColor(pct) {
            if (!pct || isNaN(pct)) return '#f0f0f0';
            if (pct < 45) return '#93c5fd';
            if (pct < 55) return '#f1f5f9';
            return '#fca5a5';
        }

        function createTeamCourtSVG(splitsRows, teamKey) {
            let z0_4 = 0, z4_14 = 0, z14_plus = 0;
            const sMap = {};
            if (splitsRows) {
                splitsRows.forEach(r => {
                    sMap[r.zone] = r;
                    if (r.zone === "0-4 ft") z0_4 = r.fg_pct;
                    if (r.zone === "4-14 ft") z4_14 = r.fg_pct;
                    if (r.zone === "14+ ft") z14_plus = r.fg_pct;
                });
            }

            const getTip = (zone) => {
                const r = sMap[zone];
                return r ? `${zone}: ${r.fgm}/${r.fga} (${r.fg_pct}%) | Share: ${r.shot_share}%` : zone;
            };

            return `
                <svg class="half-court" viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg">
                    <rect class="court-zone" x="0" y="0" width="500" height="470" fill="${getGameFGColor(z14_plus)}" stroke="#333" stroke-width="4">
                        <title>${getTip('14+ ft')}</title>
                    </rect>
                    <path class="court-zone" d="M 110,0 L 110,52.5 A 140,140 0 0,0 390,52.5 L 390,0 Z" fill="${getGameFGColor(z4_14)}" stroke="#555" stroke-width="2">
                        <title>${getTip('4-14 ft')}</title>
                    </path>
                    <path class="court-zone" d="M 210,0 L 210,52.5 A 40,40 0 0,0 290,52.5 L 290,0 Z" fill="${getGameFGColor(z0_4)}" stroke="#555" stroke-width="2">
                        <title>${getTip('0-4 ft')}</title>
                    </path>

                    <rect x="170" y="0" width="160" height="190" fill="none" stroke="#222" stroke-width="2" pointer-events="none"/>
                    <circle cx="250" cy="190" r="60" fill="none" stroke="#222" stroke-width="2" pointer-events="none"/>
                    <line x1="220" y1="40" x2="280" y2="40" stroke="#000" stroke-width="4" pointer-events="none"/>
                    <circle cx="250" cy="52.5" r="9" fill="none" stroke="#d97706" stroke-width="3" pointer-events="none"/>
                    <path d="M 30,0 L 30,140 A 237.5,237.5 0 0,0 470,140 L 470,0" fill="none" stroke="#222" stroke-width="2" pointer-events="none"/>
                </svg>
            `;
        }

        function renderBoxScore(game) {
            const container = document.getElementById('boxscore-content');
            const awayLink = game.away_team_id ? `<a class="table-link" href="team.html?id=${game.away_team_id}">${game.away_team}</a>` : game.away_team;
            const homeLink = game.home_team_id ? `<a class="table-link" href="team.html?id=${game.home_team_id}">${game.home_team}</a>` : game.home_team;

            let html = `
                <div class="game-summary">
                    <h1>${awayLink} ${game.away_score} &ndash; ${game.home_score} ${homeLink}</h1>
                    <div class="meta">${game.date} | ${game.venue}</div>
                </div>
            `;

            if (game.four_factors && game.four_factors.rows) {
                html += `<h3>Four Factors Comparison</h3>`;
                const ffId = "table_four_factors";
                boxTableState[ffId] = {
                    metaKeys: game.four_factors.meta_keys || ["team"],
                    rows: game.four_factors.rows || [],
                    sortCol: null,
                    isAsc: false
                };
                html += `<div id="${ffId}_box">${renderSortableBoxTable(ffId)}</div>`;
            }

            (game.teams || []).forEach((team, tIdx) => {
                const teamTitleLink = team.team_id ? `<a class="table-link" href="team.html?id=${team.team_id}">${team.team_name}</a>` : team.team_name;
                html += `<h3>${teamTitleLink} Box Score</h3>`;

                const boxId = `table_team_${tIdx}_players`;
                boxTableState[boxId] = {
                    metaKeys: team.meta_keys || ["player", "pos"],
                    rows: team.rows || [],
                    sortCol: null,
                    isAsc: false
                };
                html += `<div id="${boxId}_box">${renderSortableBoxTable(boxId)}</div>`;

                if (team.shooting_splits && team.shooting_splits.rows) {
                    html += `<h4>${teamTitleLink} Shooting Splits</h4>`;
                    const splitId = `table_team_${tIdx}_splits`;
                    boxTableState[splitId] = {
                        metaKeys: team.shooting_splits.meta_keys || ["zone"],
                        rows: team.shooting_splits.rows || [],
                        sortCol: null,
                        isAsc: false
                    };
                    html += `
                        <div class="team-splits-container">
                            <div class="court-wrapper">
                                ${createTeamCourtSVG(team.shooting_splits.rows, `team_${tIdx}`)}
                            </div>
                            <div id="${splitId}_box">
                                ${renderSortableBoxTable(splitId)}
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function renderSortableBoxTable(tblId) {
            const state = boxTableState[tblId];
            if (!state || state.rows.length === 0) return "<p>No stats recorded.</p>";

            const sample = state.rows[0];
            const allKeys = Object.keys(sample);
            const visibleKeys = allKeys.filter(k => k !== "player_id" && k !== "team_id");
            const metaCols = state.metaKeys.filter(k => visibleKeys.includes(k));
            const statCols = visibleKeys.filter(k => !state.metaKeys.includes(k));
            const orderedCols = [...metaCols, ...statCols];

            let html = `<table><thead><tr>`;
            orderedCols.forEach(col => {
                const isMeta = metaCols.includes(col);
                const isNumeric = typeof sample[col] === 'number';
                let indicator = '';

                if (state.sortCol === col) {
                    indicator = `<span class="sort-indicator">${state.isAsc ? '▲' : '▼'}</span>`;
                }

                const colUpper = col.toUpperCase();
                const tip = STAT_GLOSSARY[colUpper] || "";
                const tipAttr = tip ? `title="${tip}" class="${isNumeric && !isMeta ? 'num' : ''} has-tip"` : `class="${isNumeric && !isMeta ? 'num' : ''}"`;

                html += `<th ${tipAttr} onclick="handleBoxSort('${tblId}', '${col}')">
                    ${col.replace(/_/g, ' ').toUpperCase()} ${indicator}
                </th>`;
            });
            html += `</tr></thead><tbody>`;

            state.rows.forEach(row => {
                html += `<tr>`;
                orderedCols.forEach(col => {
                    const val = row[col];
                    const isMeta = metaCols.includes(col);
                    const isNumeric = typeof val === 'number';

                    let cellContent = val !== null ? val : '';
                    if (col === 'player' && row.player_id) {
                        cellContent = `<a class="table-link" href="player.html?id=${row.player_id}">${val}</a>`;
                    }

                    html += `<td class="${isNumeric && !isMeta ? 'num' : ''}">${cellContent}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            return html;
        }

        function handleBoxSort(tblId, col) {
            const state = boxTableState[tblId];
            if (!state || state.rows.length === 0) return;

            if (state.sortCol === col) {
                state.isAsc = !state.isAsc;
            } else {
                state.sortCol = col;
                const isNumeric = typeof state.rows[0][col] === 'number';
                state.isAsc = !isNumeric;
            }

            state.rows.sort((a, b) => {
                let valA = a[col];
                let valB = b[col];
                if (valA === null || valA === undefined) return 1;
                if (valB === null || valB === undefined) return -1;

                if (typeof valA === 'number' && typeof valB === 'number') {
                    return state.isAsc ? valA - valB : valB - valA;
                }
                valA = valA.toString().toLowerCase();
                valB = valB.toString().toLowerCase();
                if (valA < valB) return state.isAsc ? -1 : 1;
                if (valA > valB) return state.isAsc ? 1 : -1;
                return 0;
            });

            document.getElementById(`${tblId}_box`).innerHTML = renderSortableBoxTable(tblId);
        }
    </script>
</body>
</html>
