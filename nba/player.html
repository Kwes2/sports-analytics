<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Profile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px 20px;
            background-color: #fff;
            color: #222;
        }

        header {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .sport-nav {
            display: flex;
            gap: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .sport-nav a {
            color: #333;
            text-decoration: none;
            padding: 3px 6px;
        }

        .sport-nav a:hover, .sport-nav a.active {
            background-color: #333;
            color: #fff;
        }

        .back-link {
            font-size: 13px;
            color: #0056b3;
            text-decoration: underline;
            margin-bottom: 12px;
            display: inline-block;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px 16px;
            background-color: #f7f7f7;
            border: 1px solid #ccc;
            max-width: 950px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .player-header h1 {
            font-size: 22px;
            margin: 0 0 4px 0;
        }

        .player-header .meta {
            font-size: 14px;
            color: #555;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .rate-toggle-group {
            display: flex;
            border: 1px solid #888;
            border-radius: 3px;
            overflow: hidden;
            background: #eee;
        }

        .rate-btn {
            border: none;
            background: transparent;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
        }

        .rate-btn.active {
            background: #333;
            color: #fff;
            font-weight: bold;
        }

        .tool-btn {
            background: #eee;
            border: 1px solid #888;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .tool-btn:hover {
            background: #e2e2e2;
        }

        .drawer-panel {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            padding: 12px 14px;
            margin-bottom: 18px;
            font-size: 13px;
            max-width: 950px;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 4px;
        }

        .checkbox-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            background: #fafafa;
            padding: 6px 10px;
            border: 1px solid #ccc;
            margin-bottom: 8px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .preset-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .window-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .date-picker-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .date-picker-row input[type="date"] {
            border: 1px solid #888;
            padding: 3px 6px;
            font-family: inherit;
            font-size: 12px;
        }

        .action-cluster {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .calc-btn {
            background: #0056b3;
            color: #fff;
            border: 1px solid #004085;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .calc-btn:hover {
            background: #004085;
        }

        hr.drawer-divider {
            border: 0;
            border-top: 1px solid #ccc;
            margin: 8px 0;
        }

        h3 {
            font-size: 16px;
            margin: 24px 0 8px 0;
            border-bottom: 1px solid #bbb;
            padding-bottom: 4px;
            max-width: 950px;
        }

        #player-content-wrapper {
            position: relative;
            max-width: 950px;
        }

        #player-content {
            transition: opacity 0.2s ease, filter 0.2s ease;
        }

        #player-content.is-recalculating {
            opacity: 0.35;
            filter: grayscale(85%);
            pointer-events: none;
        }

        .recalc-overlay-badge {
            display: none;
            position: absolute;
            top: 250px;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            color: #fff;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
            z-index: 100;
        }

        .recalc-overlay-badge.active {
            display: block;
        }

        table.long-form-table {
            border-collapse: collapse;
            width: 100%;
            max-width: 950px;
            font-size: 13px;
            border: 1px solid #888;
            margin-bottom: 18px;
        }

        th, td {
            padding: 5px 10px;
            border: 1px solid #ccc;
        }

        th {
            background-color: #eee;
            font-weight: bold;
            text-align: left;
            border-bottom: 2px solid #888;
            user-select: none;
            white-space: nowrap;
        }

        th.num, td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        th.has-tip, td.has-tip {
            border-bottom: 1px dotted #555;
            cursor: help;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #ffffcc;
        }

        td.pctile-cell {
            text-align: right;
            font-weight: 500;
        }

        .shot-chart-container {
            display: flex;
            gap: 25px;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 25px;
            max-width: 950px;
        }

        .court-wrapper {
            border: 1px solid #888;
            background-color: #fafafa;
            padding: 10px;
            width: 250px;
        }

        .court-title {
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .court-info-box {
            margin-top: 8px;
            padding: 6px;
            background: #eee;
            border: 1px solid #ccc;
            font-size: 11px;
            min-height: 48px;
            line-height: 1.4;
        }

        svg.half-court {
            width: 100%;
            height: auto;
            display: block;
        }

        .court-zone {
            cursor: pointer;
            transition: opacity 0.15s, stroke-width 0.15s;
        }

        .court-zone:hover {
            opacity: 0.85;
            stroke: #000 !important;
            stroke-width: 3 !important;
        }

        a.table-link {
            color: #0056b3;
            text-decoration: underline;
        }

        .starter-star {
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div class="sport-nav">
            <a href="../afl/">AFL</a>
            <a href="../nfl/">NFL</a>
            <a href="./" class="active">NBA</a>
            <a href="../nhl/">NHL</a>
            <a href="../f1/">F1</a>
        </div>
    </header>

    <a href="./" class="back-link">← Back to NBA Stats & Schedule</a>

    <div id="player-header-container"></div>
    <div id="player-date-drawer"></div>

    <div id="player-content-wrapper">
        <div id="player-recalc-badge" class="recalc-overlay-badge">⏳ Recalculating player percentiles and ranks across the league...</div>
        <div id="player-content">Loading player profile...</div>
    </div>

    <script>
        function getDataPath(fileName) {
            const p = window.location.pathname.toLowerCase();
            if (p.includes('/nba/') || p.endsWith('/nba')) {
                return `data/${fileName}`;
            }
            return `nba/data/${fileName}`;
        }

        function getApiPath(endpoint) {
            const p = window.location.pathname.toLowerCase();
            if (p.includes('/nba/') || p.endsWith('/nba')) {
                return `api/${endpoint}`;
            }
            return `nba/api/${endpoint}`;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('id');

        let STAT_DEFINITIONS = {};
        let zoneStatsMap = {};
        let defaultPlayerData = null;
        let currentLoadedData = null;
        let showWindowDrawer = false;
        let activePlayerRecalcController = null;

        // Rate Mode: 'pg' (Per Game), 'p100' (Per 100 Possessions), 'p36' (Per 36 Minutes)
        let activePlayerRateMode = 'pg';

        const playerSeasonState = JSON.parse(sessionStorage.getItem('nba_season_state')) || {
            curr_reg: true,
            curr_post: false,
            prev_reg: false,
            prev_post: false,
            last_1_wks: false,
            last_5_wks: false,
            last_10_wks: false,
            use_custom_date: false,
            start_date: "2025-10-22",
            end_date: "2026-04-15"
        };

        fetch(getDataPath('stat_definitions.json'))
            .then(res => res.json())
            .then(data => { STAT_DEFINITIONS = data; })
            .catch(() => {});

        window.onload = () => {
            if (!playerId) {
                document.getElementById('player-content').innerHTML = "<p style='color:red;'>No Player ID provided in URL.</p>";
                return;
            }

            fetch(`${getApiPath('player_window')}?id=${playerId}&season_year=2027&season_type=2`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    defaultPlayerData = data;
                    currentLoadedData = data;
                    renderHeader(data.name, data.team, data.team_id, data.position, "2026-2027 (Regular Season)");
                    renderProfileSections(data);
                })
                .catch(() => {
                    document.getElementById('player-content').innerHTML = `<p style="color:red">Failed to load profile for Player ID ${playerId}.</p>`;
                });
        };

        function switchPlayerRateMode(mode) {
            activePlayerRateMode = mode;
            document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`p-rate-${mode}`);
            if (activeBtn) activeBtn.classList.add('active');
            if (currentLoadedData) renderProfileSections(currentLoadedData);
        }

        function renderHeader(name, team, teamId, position, windowLabel) {
            const container = document.getElementById('player-header-container');
            const teamLink = teamId ? `<a class="table-link" href="team.html?id=${teamId}">${team}</a>` : team;

            container.innerHTML = `
                <div class="player-header">
                    <div>
                        <h1>${name}</h1>
                        <div class="meta">${teamLink} | Position: <strong>${position}</strong> | Window: <strong id="current-window-label">${windowLabel}</strong></div>
                    </div>
                    <div class="header-controls">
                        <div class="rate-toggle-group">
                            <button id="p-rate-pg" class="rate-btn ${activePlayerRateMode === 'pg' ? 'active' : ''}" onclick="switchPlayerRateMode('pg')">Per Game</button>
                            <button id="p-rate-p100" class="rate-btn ${activePlayerRateMode === 'p100' ? 'active' : ''}" onclick="switchPlayerRateMode('p100')">Per 100 Poss</button>
                            <button id="p-rate-p36" class="rate-btn ${activePlayerRateMode === 'p36' ? 'active' : ''}" onclick="switchPlayerRateMode('p36')">Per 36 Min</button>
                        </div>
                        <button class="tool-btn" onclick="toggleWindowDrawer()">📅 Seasons & Ranges</button>
                    </div>
                </div>
            `;
        }

        function toggleWindowDrawer() {
            showWindowDrawer = !showWindowDrawer;
            const container = document.getElementById('player-date-drawer');
            if (!showWindowDrawer) {
                container.innerHTML = "";
                return;
            }

            container.innerHTML = `
                <div class="drawer-panel">
                    <div class="drawer-header">
                        <strong>Recalculate Player Profile over Window:</strong>
                        <button class="tool-btn" onclick="toggleWindowDrawer()">Close</button>
                    </div>

                    <div class="checkbox-group">
                        <label><input type="checkbox" id="chk-p-curr-reg" ${playerSeasonState.curr_reg ? 'checked' : ''} onchange="handlePlayerSeasonChange('curr_reg')"> [2026-2027] (Regular Season)</label>
                        <label><input type="checkbox" id="chk-p-curr-post" ${playerSeasonState.curr_post ? 'checked' : ''} onchange="handlePlayerSeasonChange('curr_post')"> [2026-2027] (Playoffs)</label>
                        <label><input type="checkbox" id="chk-p-prev-reg" ${playerSeasonState.prev_reg ? 'checked' : ''} onchange="handlePlayerSeasonChange('prev_reg')"> [2025-2026] (Regular Season)</label>
                        <label><input type="checkbox" id="chk-p-prev-post" ${playerSeasonState.prev_post ? 'checked' : ''} onchange="handlePlayerSeasonChange('prev_post')"> [2025-2026] (Playoffs)</label>
                    </div>

                    <hr class="drawer-divider"/>

                    <div class="preset-bar">
                        <label><input type="checkbox" id="chk-p-last-1" ${playerSeasonState.last_1_wks ? 'checked' : ''} onchange="togglePlayerWeeksFilter(1)"> [Last 1 Week]</label>
                        <label style="margin-left: 12px;"><input type="checkbox" id="chk-p-last-5" ${playerSeasonState.last_5_wks ? 'checked' : ''} onchange="togglePlayerWeeksFilter(5)"> [Last 5 Weeks]</label>
                        <label style="margin-left: 12px;"><input type="checkbox" id="chk-p-last-10" ${playerSeasonState.last_10_wks ? 'checked' : ''} onchange="togglePlayerWeeksFilter(10)"> [Last 10 Weeks]</label>
                    </div>

                    <hr class="drawer-divider"/>

                    <div class="window-bottom-row">
                        <div class="date-picker-row">
                            <label><input type="checkbox" id="chk-p-custom-range" ${playerSeasonState.use_custom_date ? 'checked' : ''} onchange="togglePlayerCustomRangeCheckbox()"> <strong>[Custom Date Range]</strong></label>
                            <label style="margin-left:6px;">From: <input type="date" id="p-start-date" value="${playerSeasonState.start_date}" /></label>
                            <label>To: <input type="date" id="p-end-date" value="${playerSeasonState.end_date}" /></label>
                        </div>

                        <div class="action-cluster">
                            <span id="player-calc-status" style="font-size: 11px; color: #555;"></span>
                            <button class="tool-btn" onclick="resetToFullSeason()">Reset Full Season</button>
                            <button class="calc-btn" onclick="executePlayerWindowRecalculation()">⚡ Recalculate Profile</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function indicatePlayerStaleStatus() {
            const status = document.getElementById('player-calc-status');
            if (status) status.innerHTML = "<em>Selection changed. Click [Recalculate Profile] to apply.</em>";
        }

        function handlePlayerSeasonChange(key) {
            playerSeasonState[key] = document.getElementById(`chk-p-${key.replace('_', '-')}`).checked;
            if (playerSeasonState[key]) {
                playerSeasonState.last_1_wks = false;
                playerSeasonState.last_5_wks = false;
                playerSeasonState.last_10_wks = false;
                playerSeasonState.use_custom_date = false;

                ['chk-p-last-1', 'chk-p-last-5', 'chk-p-last-10', 'chk-p-custom-range'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.checked = false;
                });
            }
            sessionStorage.setItem('nba_season_state', JSON.stringify(playerSeasonState));
            indicatePlayerStaleStatus();
        }

        function togglePlayerWeeksFilter(weeks) {
            const is1 = (weeks === 1);
            const is5 = (weeks === 5);
            const targetId = is1 ? 'chk-p-last-1' : (is5 ? 'chk-p-last-5' : 'chk-p-last-10');
            const targetChecked = document.getElementById(targetId).checked;

            playerSeasonState.last_1_wks = is1 ? targetChecked : false;
            playerSeasonState.last_5_wks = is5 ? targetChecked : false;
            playerSeasonState.last_10_wks = (!is1 && !is5) ? targetChecked : false;

            if (targetChecked) {
                playerSeasonState.curr_reg = false;
                playerSeasonState.curr_post = false;
                playerSeasonState.prev_reg = false;
                playerSeasonState.prev_post = false;
                playerSeasonState.use_custom_date = false;

                ['curr-reg', 'curr-post', 'prev-reg', 'prev-post'].forEach(id => {
                    const el = document.getElementById(`chk-p-${id}`);
                    if (el) el.checked = false;
                });
                ['chk-p-last-1', 'chk-p-last-5', 'chk-p-last-10'].forEach(id => {
                    if (id !== targetId) {
                        const el = document.getElementById(id);
                        if (el) el.checked = false;
                    }
                });
                const cc = document.getElementById('chk-p-custom-range');
                if (cc) cc.checked = false;

                const now = new Date();
                const past = new Date(now.getTime() - (weeks * 7 * 24 * 60 * 60 * 1000));
                playerSeasonState.start_date = past.toISOString().slice(0, 10);
                playerSeasonState.end_date = now.toISOString().slice(0, 10);

                document.getElementById('p-start-date').value = playerSeasonState.start_date;
                document.getElementById('p-end-date').value = playerSeasonState.end_date;
            }

            sessionStorage.setItem('nba_season_state', JSON.stringify(playerSeasonState));
            indicatePlayerStaleStatus();
        }

        function togglePlayerCustomRangeCheckbox() {
            const isChecked = document.getElementById('chk-p-custom-range').checked;
            playerSeasonState.use_custom_date = isChecked;

            if (isChecked) {
                playerSeasonState.curr_reg = false;
                playerSeasonState.curr_post = false;
                playerSeasonState.prev_reg = false;
                playerSeasonState.prev_post = false;
                playerSeasonState.last_1_wks = false;
                playerSeasonState.last_5_wks = false;
                playerSeasonState.last_10_wks = false;

                ['curr-reg', 'curr-post', 'prev-reg', 'prev-post', 'last-1', 'last-5', 'last-10'].forEach(id => {
                    const el = document.getElementById(`chk-p-${id}`);
                    if (el) el.checked = false;
                });
            } else {
                playerSeasonState.curr_reg = true;
                const el = document.getElementById('chk-p-curr-reg');
                if (el) el.checked = true;
            }

            sessionStorage.setItem('nba_season_state', JSON.stringify(playerSeasonState));
            indicatePlayerStaleStatus();
        }

        function executePlayerWindowRecalculation() {
            if (activePlayerRecalcController) {
                activePlayerRecalcController.abort();
            }
            activePlayerRecalcController = new AbortController();
            const signal = activePlayerRecalcController.signal;

            const startDate = document.getElementById('p-start-date').value;
            const endDate = document.getElementById('p-end-date').value;
            playerSeasonState.start_date = startDate;
            playerSeasonState.end_date = endDate;
            sessionStorage.setItem('nba_season_state', JSON.stringify(playerSeasonState));

            const status = document.getElementById('player-calc-status');
            const contentElem = document.getElementById('player-content');
            const badge = document.getElementById('player-recalc-badge');

            if (contentElem) contentElem.classList.add('is-recalculating');
            if (badge) badge.classList.add('active');
            if (status) status.innerText = "Recalculating league percentiles & ranks...";

            const queryParams = new URLSearchParams();
            queryParams.append("id", playerId);

            if (playerSeasonState.use_custom_date || playerSeasonState.last_1_wks || playerSeasonState.last_5_wks || playerSeasonState.last_10_wks) {
                queryParams.append("start", startDate);
                queryParams.append("end", endDate);
            } else {
                if (playerSeasonState.curr_reg) { queryParams.append("season_year", "2027"); queryParams.append("season_type", "2"); }
                if (playerSeasonState.curr_post) { queryParams.append("season_year", "2027"); queryParams.append("season_type", "3"); }
                if (playerSeasonState.prev_reg) { queryParams.append("season_year", "2026"); queryParams.append("season_type", "2"); }
                if (playerSeasonState.prev_post) { queryParams.append("season_year", "2026"); queryParams.append("season_type", "3"); }
            }

            const finishRecalc = () => {
                if (contentElem) contentElem.classList.remove('is-recalculating');
                if (badge) badge.classList.remove('active');
            };

            fetch(`${getApiPath('player_window')}?${queryParams.toString()}`, { signal: signal })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    finishRecalc();
                    if (data.error) {
                        status.innerText = data.error;
                        return;
                    }
                    status.innerText = "Done!";
                    const label = playerSeasonState.use_custom_date ? `${startDate} to ${endDate}` : (playerSeasonState.last_1_wks ? "Last 1 Week" : (playerSeasonState.last_5_wks ? "Last 5 Weeks" : (playerSeasonState.last_10_wks ? "Last 10 Weeks" : "Season Filter")));
                    document.getElementById('current-window-label').innerText = label;
                    currentLoadedData = data;
                    renderProfileSections(data);
                })
                .catch(err => {
                    if (err.name === 'AbortError') return;
                    finishRecalc();
                    status.innerText = "Query timed out. Make sure server is running.";
                });
        }

        function resetToFullSeason() {
            if (defaultPlayerData) {
                document.getElementById('current-window-label').innerText = "Full Season";
                currentLoadedData = defaultPlayerData;
                renderProfileSections(defaultPlayerData);
                const status = document.getElementById('player-calc-status');
                if (status) status.innerText = "Reset to full season.";
            }
        }

        function getPercentileColor(p) {
            if (p === null || p === undefined || isNaN(p) || p === '-') return '#f0f0f0';
            const num = parseFloat(p);
            if (num < 50) {
                const t = num / 50.0;
                const r = Math.round(59 + (240 - 59) * t);
                const g = Math.round(130 + (240 - 130) * t);
                const b = Math.round(246 + (240 - 246) * t);
                return `rgb(${r}, ${g}, ${b})`;
            } else {
                const t = (num - 50.0) / 50.0;
                const r = Math.round(240 + (239 - 240) * t);
                const g = Math.round(240 + (68 - 240) * t);
                const b = Math.round(240 + (68 - 240) * t);
                return `rgb(${r}, ${g}, ${b})`;
            }
        }

        function getFormattedStatName(baseName, statKey) {
            const k = statKey.toLowerCase();
            let label = baseName;
            if (activePlayerRateMode === 'p36') {
                label = label.replace(/ Per Game$/, ' / 36 Min').replace(/ PG$/, ' / 36 Min');
            } else if (activePlayerRateMode === 'p100') {
                label = label.replace(/ Per Game$/, ' / 100 Poss').replace(/ PG$/, ' / 100 Poss');
            }
            return label;
        }

        function formatDisplayValue(val, key, minPg, possPg) {
            if (val === null || val === undefined || val === '') return '-';
            if (typeof val !== 'number') return val;

            const k = key.toLowerCase();
            let scaledVal = val;

            if (activePlayerRateMode !== 'pg') {
                const min = minPg && minPg > 0 ? minPg : 36.0;
                const isCountingStat = (k.endsWith('_pg') || k === 'pts' || k === 'reb' || k === 'ast' || k === 'stl' || k === 'blk' || k === 'to' || k === 'fga' || k === 'fgm');
                if (isCountingStat) {
                    if (activePlayerRateMode === 'p36') {
                        scaledVal = (val * (36.0 / min));
                    } else if (activePlayerRateMode === 'p100') {
                        const poss = (possPg && possPg > 0) ? possPg : (min * 2.0);
                        scaledVal = (val * (100.0 / poss));
                    }
                }
            }

            const meta = STAT_DEFINITIONS[k];
            if (meta) {
                if (meta.format === 'int') return Math.round(scaledVal);
                if (meta.format === 'float2') return scaledVal.toFixed(2);
                if (meta.format === 'pct1') return `${scaledVal.toFixed(1)}%`;
                if (meta.format === 'float1') return scaledVal.toFixed(1);
            }

            if (k === 'ppsa' || k === 'ast_to_ratio' || k.includes('pts_per_ast') || k.includes('xpts') || k === 'paoe' || k.includes('rapm') || k === 'vorp') {
                return scaledVal.toFixed(2);
            }
            if (k.includes('pct') || k.includes('_pg') || k === 'smoe' || k === 'mei' || k.includes('rate') || k.includes('share') || k === 'bpm' || k === 'per') {
                return scaledVal.toFixed(1);
            }
            return Number.isInteger(scaledVal) ? scaledVal : scaledVal.toFixed(1);
        }

        function getRatePercentile(row, isLeague) {
            if (!row) return 50.0;
            if (activePlayerRateMode === 'p36' && row.league_percentile_p36 !== undefined) {
                return isLeague ? row.league_percentile_p36 : row.pos_percentile_p36;
            } else if (activePlayerRateMode === 'p100' && row.league_percentile_p100 !== undefined) {
                return isLeague ? row.league_percentile_p100 : row.pos_percentile_p100;
            }
            return isLeague ? row.league_percentile : row.pos_percentile;
        }

        function renderProfileSections(data) {
            const container = document.getElementById('player-content');
            let html = "";

            let playerMinPg = 36.0;
            let playerPossPg = 0.0;
            (data.sections || []).forEach(sec => {
                if (sec.type === "long_form_stats" && sec.data.rows) {
                    const mRow = sec.data.rows.find(r => r.stat_key === "min_pg");
                    if (mRow && mRow.value) playerMinPg = parseFloat(mRow.value);
                    const pRow = sec.data.rows.find(r => r.stat_key === "poss_pg");
                    if (pRow && pRow.value) playerPossPg = parseFloat(pRow.value);
                }
            });

            (data.sections || []).forEach((sec) => {
                if (sec.type === "long_form_stats") {
                    html += `<h3>${sec.title}</h3>`;
                    html += `<table class="long-form-table">
                        <thead>
                            <tr>
                                <th>Metric</th>
                                <th class="num">Value (${activePlayerRateMode.toUpperCase()})</th>
                                <th class="num">League Rank</th>
                                <th class="num">League %ile</th>
                                <th class="num">Position Rank (${data.position})</th>
                                <th class="num">Position %ile</th>
                            </tr>
                        </thead>
                        <tbody>`;

                    (sec.data.rows || []).forEach(r => {
                        const meta = STAT_DEFINITIONS[r.stat_key.toLowerCase()];
                        const tip = (meta && meta.tooltip) ? meta.tooltip : r.tooltip;
                        const tipAttr = tip ? `class="has-tip" title="${tip}"` : '';

                        const displayName = getFormattedStatName(r.stat_name, r.stat_key);
                        const lPct = getRatePercentile(r, true);
                        const pPct = getRatePercentile(r, false);

                        const lPctColor = getPercentileColor(lPct);
                        const pPctColor = getPercentileColor(pPct);

                        html += `<tr>
                            <td ${tipAttr}><strong>${displayName}</strong></td>
                            <td class="num"><strong>${formatDisplayValue(r.value, r.stat_key, playerMinPg, playerPossPg)}</strong>
                            <td class="num">#${r.league_rank}</td>
                            <td class="pctile-cell" style="background-color: ${lPctColor};">${lPct}</td>
                            <td class="num">#${r.pos_rank}</td>
                            <td class="pctile-cell" style="background-color: ${pPctColor};">${pPct}</td>
                        </tr>`;
                    });

                    html += `</tbody></table>`;

                } else if (sec.type === "shot_chart") {
                    html += `<h3>${sec.title}</h3>`;
                    html += `
                        <div class="shot-chart-container">
                            <div class="court-wrapper">
                                <div class="court-title">Efficiency Heat Map</div>
                                ${createCourtSVG(sec.data.rows)}
                                <div class="court-info-box" id="court-info-box">
                                    <em>Hover over any zone to inspect shot volume and efficiency.</em>
                                </div>
                            </div>
                            <div>
                                <table class="long-form-table" style="min-width: 450px;">
                                    <thead>
                                        <tr>
                                            <th>Zone</th>
                                            <th class="num">FGM</th>
                                            <th class="num">FGA</th>
                                            <th class="num">FG %</th>
                                            <th class="num">Shot Share</th>
                                            <th class="num">League Avg</th>
                                            <th class="num">Eff %ile</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${sec.data.rows.map(r => `
                                            <tr>
                                                <td>${r.zone}</td>
                                                <td class="num">${r.fgm}</td>
                                                <td class="num">${r.fga}</td>
                                                <td class="num">${r.fg_pct}%</td>
                                                <td class="num">${r.shot_share}%</td>
                                                <td class="num">${r.league_avg_fg}%</td>
                                                <td class="pctile-cell" style="background-color: ${getPercentileColor(r.eff_percentile)};">${r.eff_percentile}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                } else if (sec.type === "table") {
                    html += `<h3>${sec.title}</h3>`;
                    html += renderStandardTable(sec.data);
                }
            });

            container.innerHTML = html;
        }

        function createCourtSVG(splitsRows) {
            zoneStatsMap = {};
            let z0_4 = 50, z4_14 = 50, z14_plus = 50;
            if (splitsRows) {
                splitsRows.forEach(r => {
                    zoneStatsMap[r.zone] = r;
                    if (r.zone === "0-4 ft") z0_4 = r.eff_percentile;
                    if (r.zone === "4-14 ft") z4_14 = r.eff_percentile;
                    if (r.zone === "14+ ft") z14_plus = r.eff_percentile;
                });
            }

            const getTooltipText = (zone) => {
                const r = zoneStatsMap[zone];
                if (!r) return zone;
                return `${zone}: ${r.fgm}/${r.fga} (${r.fg_pct}%) | Share: ${r.shot_share}% | Eff %ile: ${r.eff_percentile}`;
            };

            return `
                <svg class="half-court" viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg">
                    <rect class="court-zone" x="0" y="0" width="500" height="470" fill="${getPercentileColor(z14_plus)}" stroke="#333" stroke-width="4"
                        onmouseenter="showZoneHover('14+ ft')" onmouseleave="clearZoneHover()">
                        <title>${getTooltipText('14+ ft')}</title>
                    </rect>

                    <path class="court-zone" d="M 110,0 L 110,52.5 A 140,140 0 0,0 390,52.5 L 390,0 Z" fill="${getPercentileColor(z4_14)}" stroke="#555" stroke-width="2"
                        onmouseenter="showZoneHover('4-14 ft')" onmouseleave="clearZoneHover()">
                        <title>${getTooltipText('4-14 ft')}</title>
                    </path>

                    <path class="court-zone" d="M 210,0 L 210,52.5 A 40,40 0 0,0 290,52.5 L 290,0 Z" fill="${getPercentileColor(z0_4)}" stroke="#555" stroke-width="2"
                        onmouseenter="showZoneHover('0-4 ft')" onmouseleave="clearZoneHover()">
                        <title>${getTooltipText('0-4 ft')}</title>
                    </path>

                    <rect x="170" y="0" width="160" height="190" fill="none" stroke="#222" stroke-width="2" pointer-events="none"/>
                    <circle cx="250" cy="190" r="60" fill="none" stroke="#222" stroke-width="2" pointer-events="none"/>
                    <line x1="220" y1="40" x2="280" y2="40" stroke="#000" stroke-width="4" pointer-events="none"/>
                    <circle cx="250" cy="52.5" r="9" fill="none" stroke="#d97706" stroke-width="3" pointer-events="none"/>
                    <path d="M 30,0 L 30,140 A 237.5,237.5 0 0,0 470,140 L 470,0" fill="none" stroke="#222" stroke-width="2" pointer-events="none"/>
                </svg>
            `;
        }

        function showZoneHover(zone) {
            const box = document.getElementById('court-info-box');
            const r = zoneStatsMap[zone];
            if (!box || !r) return;
            box.innerHTML = `
                <strong>Zone: ${r.zone}</strong><br>
                FGM/FGA: <strong>${r.fgm}/${r.fga}</strong> (${r.fg_pct}%)<br>
                Shot Share: <strong>${r.shot_share}%</strong> | Lg Avg: ${r.league_avg_fg}%<br>
                Efficiency Percentile: <strong>${r.eff_percentile}</strong>
            `;
        }

        function clearZoneHover() {
            const box = document.getElementById('court-info-box');
            if (box) box.innerHTML = "<em>Hover over any court zone to inspect shot volume and efficiency.</em>";
        }

        function renderStandardTable(dataObj) {
            const rows = dataObj.rows || [];
            if (rows.length === 0) return "<p>No data recorded.</p>";
            const keys = Object.keys(rows[0]).filter(k => k !== "player_id" && k !== "team_id");

            let html = `<table class="long-form-table"><thead><tr>`;
            keys.forEach(k => {
                const meta = STAT_DEFINITIONS[k.toLowerCase()];
                const tip = meta ? meta.tooltip : "";
                const tipAttr = tip ? `class="has-tip" title="${tip}"` : '';
                html += `<th ${tipAttr}>${k.replace(/_/g, ' ').toUpperCase()}</th>`;
            });
            html += `</tr></thead><tbody>`;

            rows.forEach(r => {
                html += `<tr>`;
                keys.forEach(k => {
                    const val = r[k];
                    let display = val !== null ? val : '';

                    if (k === 'starter') {
                        display = val === 1 ? `<span class="starter-star">*</span>` : `<span style="color:#bbb; text-align:center; display:block;">-</span>`;
                    } else if (typeof val === 'number') {
                        display = formatDisplayValue(val, k);
                    }

                    html += `<td class="${typeof val === 'number' && k !== 'starter' ? 'num' : ''}">${display}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            return html;
        }
    </script>
</body>
</html>
