<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Profile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px 20px;
            background-color: #fff;
            color: #222;
        }

        header {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .sport-nav {
            display: flex;
            gap: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .sport-nav a {
            color: #333;
            text-decoration: none;
            padding: 3px 6px;
        }

        .sport-nav a:hover, .sport-nav a.active {
            background-color: #333;
            color: #fff;
        }

        .back-link {
            font-size: 13px;
            color: #0056b3;
            text-decoration: underline;
            margin-bottom: 12px;
            display: inline-block;
        }

        .player-header {
            margin-bottom: 20px;
            padding: 12px 16px;
            background-color: #f7f7f7;
            border: 1px solid #ccc;
            max-width: 950px;
        }

        .player-header h1 {
            font-size: 22px;
            margin: 0 0 4px 0;
        }

        .player-header .meta {
            font-size: 14px;
            color: #555;
        }

        h3 {
            font-size: 15px;
            margin: 22px 0 8px 0;
        }

        .shot-chart-container {
            display: flex;
            gap: 25px;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 25px;
            max-width: 950px;
        }

        .court-wrapper {
            border: 1px solid #888;
            background-color: #fafafa;
            padding: 10px;
            width: 250px;
        }

        .court-title {
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .court-info-box {
            margin-top: 8px;
            padding: 6px;
            background: #eee;
            border: 1px solid #ccc;
            font-size: 11px;
            min-height: 48px;
            line-height: 1.4;
        }

        svg.half-court {
            width: 100%;
            height: auto;
            display: block;
        }

        .court-zone {
            cursor: pointer;
            transition: opacity 0.15s, stroke-width 0.15s;
        }

        .court-zone:hover {
            opacity: 0.85;
            stroke: #000 !important;
            stroke-width: 3 !important;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 950px;
            font-size: 13px;
            border: 1px solid #888;
            margin-bottom: 25px;
        }

        .shot-chart-container table {
            flex: 1;
            min-width: 450px;
            margin-bottom: 0;
        }

        th, td {
            padding: 4px 8px;
            border: 1px solid #ccc;
        }

        th {
            background-color: #eee;
            font-weight: bold;
            text-align: left;
            border-bottom: 2px solid #888;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background-color: #e2e2e2;
        }

        th.has-tip {
            border-bottom: 1px dotted #666;
            cursor: help;
        }

        th.num, td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #ffffcc;
        }

        .sort-indicator {
            font-size: 10px;
            margin-left: 4px;
            color: #666;
        }

        a.table-link {
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="sport-nav">
            <a href="../afl/">AFL</a>
            <a href="../nfl/">NFL</a>
            <a href="./" class="active">NBA</a>
            <a href="../nhl/">NHL</a>
            <a href="../f1/">F1</a>
        </div>
    </header>

    <a href="./" class="back-link">← Back to NBA Stats & Schedule</a>

    <div id="player-content">Loading player profile...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const playerId = urlParams.get('id');

        const STAT_GLOSSARY = {
            "GP": "Games Played",
            "MIN": "Minutes Played",
            "MIN_PG": "Minutes Per Game",
            "PTS": "Points",
            "PTS_PG": "Points Per Game",
            "REB": "Rebounds",
            "REB_PG": "Rebounds Per Game",
            "AST": "Assists",
            "AST_PG": "Assists Per Game",
            "STL": "Steals",
            "STL_PG": "Steals Per Game",
            "BLK": "Blocks",
            "BLK_PG": "Blocks Per Game",
            "TO": "Turnovers",
            "TO_PG": "Turnovers Per Game",
            "PF": "Personal Fouls",
            "FGM": "Field Goals Made",
            "FGA": "Field Goals Attempted",
            "FG_PCT": "Field Goal Percentage (FGM / FGA)",
            "FG3M": "3-Point Field Goals Made",
            "FG3A": "3-Point Field Goals Attempted",
            "FTM": "Free Throws Made",
            "FTA": "Free Throws Attempted",
            "OREB": "Offensive Rebounds",
            "DREB": "Defensive Rebounds",
            "TS_PCT": "True Shooting %: Measures scoring efficiency factoring in 2PT, 3PT, and FTs",
            "EFG_PCT": "Effective FG %: Adjusts field goal percentage to credit 3-pointers for 50% more value",
            "USG_PCT": "Usage Rate %: Percentage of team plays used while on the court",
            "TOV_PCT": "Turnover Rate %: Turnovers committed per 100 plays",
            "AST_TO_RATIO": "Assist-to-Turnover Ratio (AST / TO)",
            "THREE_PAR": "3-Point Attempt Rate (% of field goal attempts from 3PT range)",
            "FT_RATE": "Free Throw Attempt Rate (FTA / FGA)",
            "PPSA": "Points Per Shot Attempt (PTS / FGA)",
            "GMSC": "Game Score: John Hollinger's comprehensive single-game performance rating",
            "GMSC_AVG": "Average Game Score per game",
            "STOCKS_PG": "Stocks: Steals + Blocks per game",
            "SHOT_SHARE": "Percentage of total attempts taken in this distance zone",
            "LEAGUE_AVG_FG": "NBA League Average Field Goal % in this distance zone",
            "EFF_PERCENTILE": "Efficiency Percentile: Player FG% rank compared to league (0-100)",
            "VOL_PERCENTILE": "Volume Percentile: Shot attempts rank compared to league (0-100)"
        };

        const tableState = {};
        let zoneStatsMap = {};

        window.onload = () => {
            if (!playerId) {
                document.getElementById('player-content').innerHTML = "<p style='color:red;'>No Player ID provided in URL.</p>";
                return;
            }

            fetch(`data/players/${playerId}.json`)
                .then(res => res.json())
                .then(data => renderPlayerEngine(data))
                .catch(err => {
                    document.getElementById('player-content').innerHTML = `<p style="color:red">Failed to load profile for Player ID ${playerId}.</p>`;
                });
        };

        function getPercentileColor(p) {
            if (p === null || p === undefined || isNaN(p)) return '#f0f0f0';
            if (p < 50) {
                const t = p / 50.0;
                const r = Math.round(59 + (240 - 59) * t);
                const g = Math.round(130 + (240 - 130) * t);
                const b = Math.round(246 + (240 - 246) * t);
                return `rgb(${r}, ${g}, ${b})`;
            } else {
                const t = (p - 50.0) / 50.0;
                const r = Math.round(240 + (239 - 240) * t);
                const g = Math.round(240 + (68 - 240) * t);
                const b = Math.round(240 + (68 - 240) * t);
                return `rgb(${r}, ${g}, ${b})`;
            }
        }

        function createCourtSVG(splitsRows) {
            zoneStatsMap = {};
            let z0_4 = 50, z4_14 = 50, z14_plus = 50;
            if (splitsRows) {
                splitsRows.forEach(r => {
                    zoneStatsMap[r.zone] = r;
                    if (r.zone === "0-4 ft") z0_4 = r.eff_percentile;
                    if (r.zone === "4-14 ft") z4_14 = r.eff_percentile;
                    if (r.zone === "14+ ft") z14_plus = r.eff_percentile;
                });
            }

            const getTooltipText = (zone) => {
                const r = zoneStatsMap[zone];
                if (!r) return zone;
                return `${zone}: ${r.fgm}/${r.fga} (${r.fg_pct}%) | Share: ${r.shot_share}% | Eff %ile: ${r.eff_percentile}`;
            };

            return `
                <svg class="half-court" viewBox="0 0 500 470" xmlns="http://www.w3.org/2000/svg">
                    <rect class="court-zone" x="0" y="0" width="500" height="470" fill="${getPercentileColor(z14_plus)}" stroke="#333" stroke-width="4"
                        onmouseenter="showZoneHover('14+ ft')" onmouseleave="clearZoneHover()">
                        <title>${getTooltipText('14+ ft')}</title>
                    </rect>

                    <path class="court-zone" d="M 110,0 L 110,52.5 A 140,140 0 0,0 390,52.5 L 390,0 Z" fill="${getPercentileColor(z4_14)}" stroke="#555" stroke-width="2"
                        onmouseenter="showZoneHover('4-14 ft')" onmouseleave="clearZoneHover()">
                        <title>${getTooltipText('4-14 ft')}</title>
                    </path>

                    <path class="court-zone" d="M 210,0 L 210,52.5 A 40,40 0 0,0 290,52.5 L 290,0 Z" fill="${getPercentileColor(z0_4)}" stroke="#555" stroke-width="2"
                        onmouseenter="showZoneHover('0-4 ft')" onmouseleave="clearZoneHover()">
                        <title>${getTooltipText('0-4 ft')}</title>
                    </path>

                    <rect x="170" y="0" width="160" height="190" fill="none" stroke="#222" stroke-width="2" pointer-events="none"/>
                    <circle cx="250" cy="190" r="60" fill="none" stroke="#222" stroke-width="2" pointer-events="none"/>
                    <line x1="220" y1="40" x2="280" y2="40" stroke="#000" stroke-width="4" pointer-events="none"/>
                    <circle cx="250" cy="52.5" r="9" fill="none" stroke="#d97706" stroke-width="3" pointer-events="none"/>
                    <path d="M 30,0 L 30,140 A 237.5,237.5 0 0,0 470,140 L 470,0" fill="none" stroke="#222" stroke-width="2" pointer-events="none"/>
                </svg>
            `;
        }

        function showZoneHover(zone) {
            const box = document.getElementById('court-info-box');
            const r = zoneStatsMap[zone];
            if (!box || !r) return;
            box.innerHTML = `
                <strong>Zone: ${r.zone}</strong><br>
                FGM/FGA: <strong>${r.fgm}/${r.fga}</strong> (${r.fg_pct}%)<br>
                Shot Share: <strong>${r.shot_share}%</strong> | Lg Avg: ${r.league_avg_fg}%<br>
                Efficiency Percentile: <strong>${r.eff_percentile}</strong>
            `;
        }

        function clearZoneHover() {
            const box = document.getElementById('court-info-box');
            if (box) box.innerHTML = "<em>Hover over any court zone to inspect shot volume and efficiency.</em>";
        }

        function renderPlayerEngine(data) {
            const container = document.getElementById('player-content');
            const teamLink = data.team_id ? `<a class="table-link" href="team.html?id=${data.team_id}">${data.team}</a>` : data.team;

            let html = `
                <div class="player-header">
                    <h1>${data.name}</h1>
                    <div class="meta">${teamLink} | Position: <strong>${data.position}</strong></div>
                </div>
            `;

            (data.sections || []).forEach((section, idx) => {
                const sectionId = `section_${idx}`;
                html += `<h3>${section.title}</h3>`;

                tableState[sectionId] = {
                    metaKeys: section.data.meta_keys || [],
                    rows: section.data.rows || [],
                    sortCol: null,
                    isAsc: false
                };

                if (section.type === "shot_chart") {
                    html += `
                        <div class="shot-chart-container">
                            <div class="court-wrapper">
                                <div class="court-title">Efficiency Heat Map</div>
                                ${createCourtSVG(section.data.rows)}
                                <div class="court-info-box" id="court-info-box">
                                    <em>Hover over any court zone to inspect shot volume and efficiency.</em>
                                </div>
                            </div>
                            <div id="${sectionId}_box">
                                ${buildTableHTML(sectionId)}
                            </div>
                        </div>
                    `;
                } else {
                    html += `<div id="${sectionId}_box">${buildTableHTML(sectionId)}</div>`;
                }
            });

            container.innerHTML = html;
        }

        function buildTableHTML(sectionId) {
            const state = tableState[sectionId];
            if (!state || state.rows.length === 0) return "<p>No data recorded.</p>";

            const sample = state.rows[0];
            const allKeys = Object.keys(sample);
            const metaCols = state.metaKeys.filter(k => allKeys.includes(k));
            const statCols = allKeys.filter(k => !state.metaKeys.includes(k));
            const orderedCols = [...metaCols, ...statCols];

            let html = `<table><thead><tr>`;
            orderedCols.forEach(col => {
                const isMeta = metaCols.includes(col);
                const isNumeric = typeof sample[col] === 'number';
                let indicator = '';

                if (state.sortCol === col) {
                    indicator = `<span class="sort-indicator">${state.isAsc ? '▲' : '▼'}</span>`;
                }

                const colUpper = col.toUpperCase();
                const tip = STAT_GLOSSARY[colUpper] || "";
                const tipAttr = tip ? `title="${tip}" class="${isNumeric && !isMeta ? 'num' : ''} has-tip"` : `class="${isNumeric && !isMeta ? 'num' : ''}"`;

                html += `<th ${tipAttr} onclick="handleSort('${sectionId}', '${col}')">
                    ${col.replace(/_/g, ' ').toUpperCase()} ${indicator}
                </th>`;
            });
            html += `</tr></thead><tbody>`;

            state.rows.forEach(row => {
                html += `<tr>`;
                orderedCols.forEach(col => {
                    const val = row[col];
                    const isMeta = metaCols.includes(col);
                    const isNumeric = typeof val === 'number';
                    html += `<td class="${isNumeric && !isMeta ? 'num' : ''}">${val !== null ? val : ''}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            return html;
        }

        function handleSort(sectionId, col) {
            const state = tableState[sectionId];
            if (!state || state.rows.length === 0) return;

            if (state.sortCol === col) {
                state.isAsc = !state.isAsc;
            } else {
                state.sortCol = col;
                const isNumeric = typeof state.rows[0][col] === 'number';
                state.isAsc = !isNumeric;
            }

            state.rows.sort((a, b) => {
                let valA = a[col];
                let valB = b[col];
                if (valA === null || valA === undefined) return 1;
                if (valB === null || valB === undefined) return -1;

                if (typeof valA === 'number' && typeof valB === 'number') {
                    return state.isAsc ? valA - valB : valB - valA;
                }
                valA = valA.toString().toLowerCase();
                valB = valB.toString().toLowerCase();
                if (valA < valB) return state.isAsc ? -1 : 1;
                if (valA > valB) return state.isAsc ? 1 : -1;
                return 0;
            });

            document.getElementById(`${sectionId}_box`).innerHTML = buildTableHTML(sectionId);
        }
    </script>
</body>
</html>
