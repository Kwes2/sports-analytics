name: Auto-Update Sports Stats

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch:       # Allows you to trigger it manually anytime from GitHub UI

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    # Grants GitHub Actions permission to commit and push back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run NBA Data Pipeline
        run: |
          python nba/fetch_and_compute.py

      - name: Commit and push updated database & JSONs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nba/data/
          git diff --staged --quiet || git commit -m "Auto-update NBA stats and database [skip ci]"
          git push